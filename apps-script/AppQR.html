<script>
  /* Control de Gestión · Código QR (para activar la verificación en dos pasos). Es una parte de la app: se junta con las demás App*.html (ver FRAGMENTOS_APP en Servidor.gs).

     Hecho aquí, sin librerías (la app no carga código de terceros): modo
     «bytes», corrección de errores nivel M, versiones 1 a 15 y la máscara
     con menos penalización, según ISO/IEC 18004. La prueba de pruebas/qr.test.cjs
     genera varios códigos y los lee con un lector real (OpenCV). */
  var QR = (function () {
    // Por versión (1–15), nivel M: bytes de corrección por bloque y número de bloques
    var ECC_M = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24];
    var BLOQUES_M = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10];

    function modulosCrudos(v) {
      var r = (16 * v + 128) * v + 64;
      if (v >= 2) {
        var n = Math.floor(v / 7) + 2;
        r -= (25 * n - 10) * n - 55;
        if (v >= 7) r -= 36;
      }
      return r;
    }
    function capacidad(v) { return Math.floor(modulosCrudos(v) / 8) - ECC_M[v] * BLOQUES_M[v]; }

    function multGF(x, y) {
      var z = 0;
      for (var i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; }
      return z;
    }
    function divisorRS(grado) {
      var r = [];
      for (var i = 0; i < grado - 1; i++) r.push(0);
      r.push(1);
      var raiz = 1;
      for (var k = 0; k < grado; k++) {
        for (var j = 0; j < r.length; j++) { r[j] = multGF(r[j], raiz); if (j + 1 < r.length) r[j] ^= r[j + 1]; }
        raiz = multGF(raiz, 0x02);
      }
      return r;
    }
    function restoRS(datos, divisor) {
      var r = divisor.map(function () { return 0; });
      datos.forEach(function (b) {
        var f = b ^ r.shift();
        r.push(0);
        divisor.forEach(function (c, i) { r[i] ^= multGF(c, f); });
      });
      return r;
    }

    function posicionesAlineacion(v, tam) {
      if (v === 1) return [];
      var n = Math.floor(v / 7) + 2;
      var paso = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
      var r = [6];
      for (var p = tam - 7; r.length < n; p -= paso) r.splice(1, 0, p);
      return r;
    }

    /** Matriz [fila][columna] de true (oscuro) / false del texto dado. */
    function matriz(texto) {
      var bytes = Array.prototype.slice.call(new TextEncoder().encode(texto));
      var v = 1;
      for (; v <= 15; v++) {
        var bitsCuenta = v <= 9 ? 8 : 16;
        if (4 + bitsCuenta + bytes.length * 8 <= capacidad(v) * 8) break;
      }
      if (v > 15) throw new Error('Texto demasiado largo para el código QR.');
      // Bits: modo «bytes» (0100), longitud, datos, fin y relleno
      var bits = [];
      var poner = function (val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      poner(4, 4);
      poner(bytes.length, v <= 9 ? 8 : 16);
      bytes.forEach(function (b) { poner(b, 8); });
      var cap = capacidad(v) * 8;
      poner(0, Math.min(4, cap - bits.length));
      poner(0, (8 - bits.length % 8) % 8);
      for (var relleno = 0xec; bits.length < cap; relleno ^= 0xec ^ 0x11) poner(relleno, 8);
      var datos = [];
      for (var i = 0; i < bits.length; i += 8) {
        var b = 0;
        for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
        datos.push(b);
      }
      // Bloques con su corrección de errores, intercalados
      var nb = BLOQUES_M[v], eccLen = ECC_M[v], total = Math.floor(modulosCrudos(v) / 8);
      var cortos = nb - total % nb, largoCorto = Math.floor(total / nb) - eccLen;
      var div = divisorRS(eccLen), bloques = [], ecc = [], k = 0;
      for (var x = 0; x < nb; x++) {
        var largo = largoCorto + (x < cortos ? 0 : 1);
        var bl = datos.slice(k, k + largo);
        k += largo;
        bloques.push(bl);
        ecc.push(restoRS(bl, div));
      }
      var final = [];
      for (var c = 0; c <= largoCorto; c++) bloques.forEach(function (bl) { if (c < bl.length) final.push(bl[c]); });
      for (var e = 0; e < eccLen; e++) ecc.forEach(function (ec) { final.push(ec[e]); });

      var tam = v * 4 + 17;
      var m = [], fija = [];
      for (var y = 0; y < tam; y++) { m.push([]); fija.push([]); for (var x2 = 0; x2 < tam; x2++) { m[y].push(false); fija[y].push(false); } }
      var fijar = function (x, y, oscuro) { m[y][x] = oscuro; fija[y][x] = true; };
      // Patrones de tiempo
      for (var t = 0; t < tam; t++) { fijar(6, t, t % 2 === 0); fijar(t, 6, t % 2 === 0); }
      // Patrones de búsqueda (tres esquinas) con su separador
      var buscador = function (cx, cy) {
        for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
          var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = cx + dx, yy = cy + dy;
          if (xx >= 0 && xx < tam && yy >= 0 && yy < tam) fijar(xx, yy, d !== 2 && d !== 4);
        }
      };
      buscador(3, 3); buscador(tam - 4, 3); buscador(3, tam - 4);
      // Patrones de alineación
      var pos = posicionesAlineacion(v, tam), np = pos.length;
      for (var a = 0; a < np; a++) for (var bb = 0; bb < np; bb++) {
        if ((a === 0 && bb === 0) || (a === 0 && bb === np - 1) || (a === np - 1 && bb === 0)) continue;
        for (var dy2 = -2; dy2 <= 2; dy2++) for (var dx2 = -2; dx2 <= 2; dx2++) fijar(pos[a] + dx2, pos[bb] + dy2, Math.max(Math.abs(dx2), Math.abs(dy2)) !== 1);
      }
      var formato = function (mascara) {
        var d = mascara;   // nivel M = 00
        var r = d;
        for (var q = 0; q < 10; q++) r = (r << 1) ^ ((r >>> 9) * 0x537);
        var f = ((d << 10) | r) ^ 0x5412;
        var bit = function (i) { return ((f >>> i) & 1) !== 0; };
        for (var i = 0; i <= 5; i++) fijar(8, i, bit(i));
        fijar(8, 7, bit(6)); fijar(8, 8, bit(7)); fijar(7, 8, bit(8));
        for (i = 9; i < 15; i++) fijar(14 - i, 8, bit(i));
        for (i = 0; i < 8; i++) fijar(tam - 1 - i, 8, bit(i));
        for (i = 8; i < 15; i++) fijar(8, tam - 15 + i, bit(i));
        fijar(8, tam - 8, true);
      };
      formato(0);   // reserva los lugares (se escribe el bueno al final)
      if (v >= 7) {
        var rv = v;
        for (var q = 0; q < 12; q++) rv = (rv << 1) ^ ((rv >>> 11) * 0x1f25);
        var bv = (v << 12) | rv;
        for (var iv = 0; iv < 18; iv++) {
          var bit = ((bv >>> iv) & 1) !== 0, aa = tam - 11 + iv % 3, bbv = Math.floor(iv / 3);
          fijar(aa, bbv, bit); fijar(bbv, aa, bit);
        }
      }
      // Datos en zigzag
      var n = 0;
      for (var der = tam - 1; der >= 1; der -= 2) {
        if (der === 6) der = 5;
        for (var vert = 0; vert < tam; vert++) for (var jj = 0; jj < 2; jj++) {
          var xz = der - jj, sube = ((der + 1) & 2) === 0, yz = sube ? tam - 1 - vert : vert;
          if (!fija[yz][xz] && n < final.length * 8) { m[yz][xz] = ((final[n >>> 3] >>> (7 - (n & 7))) & 1) !== 0; n++; }
        }
      }
      // La máscara con menos penalización
      var MASCARAS = [
        function (x, y) { return (x + y) % 2 === 0; }, function (x, y) { return y % 2 === 0; },
        function (x) { return x % 3 === 0; }, function (x, y) { return (x + y) % 3 === 0; },
        function (x, y) { return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; }, function (x, y) { return x * y % 2 + x * y % 3 === 0; },
        function (x, y) { return (x * y % 2 + x * y % 3) % 2 === 0; }, function (x, y) { return ((x + y) % 2 + x * y % 3) % 2 === 0; }
      ];
      var aplicar = function (k2) {
        for (var y3 = 0; y3 < tam; y3++) for (var x3 = 0; x3 < tam; x3++) if (!fija[y3][x3] && MASCARAS[k2](x3, y3)) m[y3][x3] = !m[y3][x3];
      };
      var mejor = 0, menor = Infinity;
      for (var k3 = 0; k3 < 8; k3++) {
        aplicar(k3); formato(k3);
        var p = penalizacion(m, tam);
        if (p < menor) { menor = p; mejor = k3; }
        aplicar(k3);   // se quita (XOR otra vez)
      }
      aplicar(mejor); formato(mejor);
      return m;
    }

    function penalizacion(m, tam) {
      var p = 0, oscuros = 0;
      var linea = function (get) {
        var racha = 0, color = null;
        for (var i = 0; i <= tam; i++) {
          var c = i < tam ? get(i) : null;
          if (c === color) racha++;
          else { if (racha >= 5) p += 3 + (racha - 5); color = c; racha = 1; }
        }
        // 1:1:3:1:1 con cuatro claros a un lado
        for (var j = 0; j + 10 < tam; j++) {
          var s = '';
          for (var q = 0; q < 11; q++) s += get(j + q) ? '1' : '0';
          if (s === '10111010000' || s === '00001011101') p += 40;
        }
      };
      for (var y = 0; y < tam; y++) {
        linea(function (x) { return m[y][x]; });
        for (var x = 0; x < tam; x++) {
          if (m[y][x]) oscuros++;
          if (x < tam - 1 && y < tam - 1 && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
        }
      }
      for (var x4 = 0; x4 < tam; x4++) linea(function (yy) { return m[yy][x4]; });
      var total = tam * tam;
      p += (Math.ceil(Math.abs(oscuros * 20 - total * 10) / total) - 1) * 10;
      return p;
    }

    /** El código como SVG (con su margen blanco de 4 módulos). */
    function svg(texto, px) {
      var m = matriz(texto), tam = m.length, borde = 4, total = tam + borde * 2;
      var d = '';
      for (var y = 0; y < tam; y++) for (var x = 0; x < tam; x++) if (m[y][x]) d += 'M' + (x + borde) + ' ' + (y + borde) + 'h1v1h-1z';
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('viewBox', '0 0 ' + total + ' ' + total);
      // Módulos de un número entero de pixeles (todos iguales): lo leen mejor las cámaras
      var lado = Math.max(4, Math.round((px || 220) / total)) * total;
      el.setAttribute('width', lado); el.setAttribute('height', lado);
      el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'Código QR para la app de autenticación');
      el.setAttribute('shape-rendering', 'crispEdges');
      var fondo = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      fondo.setAttribute('width', total); fondo.setAttribute('height', total); fondo.setAttribute('fill', '#fff');
      var trazo = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      trazo.setAttribute('d', d); trazo.setAttribute('fill', '#000');
      el.appendChild(fondo); el.appendChild(trazo);
      return el;
    }

    return { matriz: matriz, svg: svg };
  })();
</script>

<script>
  /* Control de Gestión · Excel, Exportación, Pendientes, Mis asuntos e Informes. Es una parte de la app: se junta con las demás App*.html (ver FRAGMENTOS_APP en Servidor.gs). */
  /* ───────────────────────── Excel ───────────────────────── */
  var ANCHOS = { numero: 24, dirigido: 34, asunto: 48, fecha: 12, fecha_recepcion: 12, firma: 34, elaboro: 16, acuse: 9, carpeta: 9, area: 30, observaciones: 44 };
  /** Arma y descarga el Excel con las filas que mandó el servidor (una hoja por libreta). */

    var hojas = tipos.map(function (t) {
      var def = tipoDef(t);
      var filas = res.filas.filter(function (r) { return r.tipo === t; }).sort(function (a, b) {

      });

      def.campos.forEach(function (c) {

        extractores.push(function (r) {
          if (k === 'dirigido') return r.dirigido_a;
          if (k === 'acuse') return r.acuse === 'SI' ? 'Sí' : '';
          return r[k];
        });
      });
      [['Estatus', 13, 'centro', function (r) { return r.estatus + (r.estatus === 'Cancelado' && r.motivo_cancelacion ? ': ' + r.motivo_cancelacion : ''); }],
        ['Fecha límite', 12, 'fecha', function (r) { return r.fecha_limite; }],
        ['Turnado a', 24, 'texto', function (r) { return r.turnado_a; }],
        ['Responsable en el sistema', 18, 'texto', function (r) { return r.turnado_usuario || ''; }],
        ['Fecha de atención', 12, 'fecha', function (r) { return r.fecha_atencion || ''; }]].forEach(function (x) { enc.push(x[0]); anchos.push(x[1]); tiposCol.push(x[2]); extractores.push(x[3]); });

        encabezados: enc, anchos: anchos, tipos: tiposCol,
        filas: filas.map(function (r) { return extractores.map(function (f) { return f(r); }); }),
        pie: 'Fuente: Control de Gestión. Fecha considerada: la de recibido; si no tiene, la del documento. Los cancelados conservan su número y muestran el motivo en «Estatus».'
      };
    });

  }

  /* ───────────────────────── Exportación (solo administradores) ───────────────────────── */
  vistas.exportacion = function () {

    var hoy = hoyIso(), anioHoy = Number(hoy.slice(0, 4)), mes = hoy.slice(0, 7);

      ['Este mes', mes + '-01', hoy],
      ['Mes pasado', mesPasado.a + '-' + dos(mesPasado.m) + '-01', mesPasado.a + '-' + dos(mesPasado.m) + '-' + finDeMes(mesPasado.a, mesPasado.m)],
      ['Este año', anioHoy + '-01-01', hoy],

    function marcar(b) { botonesRango.forEach(function (x) { x.classList.toggle('activo', x === b); }); }

        var tipos = libreta.value === 'TODOS' ? E.ini.orden : [libreta.value];
        resumen.appendChild(h('div', { class: 'expo__lista' }, tipos.map(function (t) {
          return h('span', { class: 'etq' }, tipoDef(t).nombre + ': ' + (r.porTipo[t] || 0));
        })));

        boton.disabled = !r.total;

    }
    [libreta].forEach(function (x) { x.addEventListener('change', previa); });
    [desde, hasta].forEach(function (x) { x.addEventListener('change', function () { marcar(null); previa(); }); });
    boton.addEventListener('click', function () {
      boton.disabled = true;
      var d = datos();
      llamar('exportar', d).then(function (res) {
        var tipos = d.tipo === 'TODOS' ? E.ini.orden : [d.tipo];
        var rango = !d.desde && !d.hasta ? 'todo' : (d.desde || 'inicio') + ' a ' + (d.hasta || hoy);
        descargarExcel(res, tipos, periodoTxt(), 'Control de Gestion - ' + (d.tipo === 'TODOS' ? 'Todas las libretas' : tipoDef(d.tipo).nombre) + ' - ' + rango + '.xlsx');

      h('div', { class: 'titulo-vista' }, h('h1', null, 'Exportación'), h('span', { class: 'sub' }, 'Descarga los registros en Excel. Solo administradores; cada descarga queda en la bitácora.')),
      h('div', { class: 'tarjeta expo' },
        campo('Libreta', libreta),
        h('div', { class: 'campo' }, h('span', { class: 'campo__et' }, 'Periodo'), h('div', { class: 'expo__rangos' }, botonesRango)),
        h('div', { class: 'expo__fechas' }, campo('Desde', desde), campo('Hasta', hasta)),
        h('div', { class: 'expo__nota' }, 'Cuenta la fecha de recibido; si el registro no la tiene, la del documento.'),
        resumen,
        h('div', null, boton))));

  };

  /* ───────────────────────── Pendientes ───────────────────────── */
  vistas.pendientes = function () {
    var cont = h('div', { class: 'pend' }, h('div', { class: 'tarjeta vacio' }, 'Cargando…'));
    marco('pendientes').appendChild(h('div', null, h('div', { class: 'titulo-vista' }, h('h1', null, 'Pendientes'),

    if (E.pend) pintar(E.pend.datos);   // lo de la visita anterior (o la precarga), al instante
    llamar('pendientes', null, E.pend ? { silencioso: true } : null).then(function (p) {
      if (gen !== E.gen) return;
      var firma = JSON.stringify(p), cambio = !E.pend || E.pend.firma !== firma;
      E.pend = { datos: p, firma: firma };

    }).catch(function (e) {
      if (E.pend) return;

    });
    function pintar(p) {
      vaciar(cont);
      function item(r, conPersona) {

          h('div', null, h('div', { class: 't-num' }, etiquetaNum(r)), h('div', { class: 'pend__tipo' }, tipoDef(r.tipo).singular)),
          h('div', null, h('div', null, r.asunto || 'Sin asunto'), h('div', { class: 'item__meta' }, [r.numero, conPersona ? per : null, r.turnado_a ? 'Turnado a: ' + r.turnado_a : null, fechaCorta(r.fecha_recepcion || r.fecha)].filter(Boolean).join(' · '))),
          h('div', { style: { display: 'grid', gap: '4px', justifyItems: 'end' } }, r.estatus ? insEstatus(r.estatus) : null, insVence(r)));
      }
      var limite = 150;
      cont.appendChild(h('section', { class: 'tarjeta' }, h('h2', null, icono('reloj'), 'Por atender', h('span', { class: 'ins' }, p.porAtender.length)),
        p.porAtender.length ? p.porAtender.slice(0, limite).map(function (r) { return item(r, true); }) : h('div', { class: 'vacio' }, 'Nada pendiente. ¡Bien!'),
        p.porAtender.length > limite ? h('div', { class: 'vacio' }, 'Y ' + (p.porAtender.length - limite) + ' más. Usa el filtro de estatus en Registros.') : null));
      cont.appendChild(h('section', { class: 'tarjeta' }, h('h2', null, icono('archivo'), 'Oficios salientes sin acuse', h('span', { class: 'ins' }, p.sinAcuse.length)),
        p.sinAcuse.length ? p.sinAcuse.slice(0, limite).map(function (r) { return item(r, true); }) : h('div', { class: 'vacio' }, 'Todos los oficios tienen acuse.'),
        p.sinAcuse.length > limite ? h('div', { class: 'vacio' }, 'Y ' + (p.sinAcuse.length - limite) + ' más. En Registros filtra «Sin acuse».') : null));
    }
  };

  /* ───────────────────────── Mis asuntos ───────────────────────── */
  vistas.misAsuntos = function () {
    var cont = h('div', { class: 'mis' }, h('div', { class: 'tarjeta vacio' }, 'Cargando…'));
    marco('misAsuntos').appendChild(h('div', null, h('div', { class: 'titulo-vista' }, h('h1', null, 'Mis asuntos'),
      h('span', { class: 'sub' }, 'Lo que te turnaron, de tus libretas')), cont));

      vaciar(cont).appendChild(h('div', { class: 'tarjeta vacio' }, h('strong', null, 'Falta publicar el servidor'), 'Esta pantalla necesita la versión ' + VERSION_APP + ' del servidor de Apps Script.'));
      return;
    }

    if (E.mis) pintar(E.mis.datos);   // lo de la visita anterior (o la precarga), al instante

      if (gen !== E.gen) return;

    }).catch(function (e) {
      if (E.mis) return;
      fallo(e); vaciar(cont).appendChild(h('div', { class: 'tarjeta vacio' }, e.message));
    });
    function pintar(m) {
      vaciar(cont);
      var hoy = m.hoy || hoyIso();

        { clave: 'hoy', titulo: 'Vencen hoy', icono: 'alarma', clase: 'mis__g--hoy', vacio: 'Nada vence hoy.', filtro: function (r) { return esActivo(r) && r.fecha_limite === hoy; } },
        { clave: 'atender', titulo: 'Por atender', icono: 'reloj', clase: '', vacio: 'Nada más por atender.', filtro: function (r) { return esActivo(r) && !(r.fecha_limite && r.fecha_limite <= hoy); } },
        { clave: 'otros', titulo: 'Atendidos, concluidos o sin estatus', icono: 'check', clase: 'mis__g--otros', vacio: 'Nada aquí todavía.', filtro: function (r) { return !esActivo(r); } }
      ];
      if (!m.asuntos.length) {

      }
      grupos.forEach(function (g) {
        var lista = m.asuntos.filter(g.filtro);

        var limite = g.clave === 'otros' ? 50 : 200;
        cont.appendChild(h('section', { class: 'tarjeta mis__g ' + g.clase },
          h('h2', null, icono(g.icono), g.titulo, h('span', { class: 'ins' }, lista.length)),

      });
      if (m.total > m.asuntos.length) cont.appendChild(h('p', { class: 'conteo' }, 'Se muestran los ' + m.asuntos.length + ' más recientes de ' + m.total + '.'));
    }
  };

  /* ───────────────────────── Informes ───────────────────────── */
  // Gráficas en SVG hechas a mano (sin librerías). Se dibujan al ancho real del
  // contenedor (así el texto se lee igual en celular) y se vuelven a dibujar al
  // cambiar el tamaño de la ventana. Los nombres y números van como texto (textContent).
  var SVGNS = 'http://www.w3.org/2000/svg';
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var HEX_TIPO = { OFS: '#8f4889', OFE: '#027a35', OFC: '#266cb4', CIR: '#9d2148', TAR: '#ac6d14', VOL: '#d72f89' };   // paleta del manual CDMX
  // Colores de estado: siempre con su ícono, su nombre y su número (nunca solos).
  // Revisados con el validador de daltonismo: verde/ámbar/rojo se distinguen también
  // con protanopía y deuteranopía; el ámbar es claro, por eso su ícono va en tinta oscura.
  var ESTADO = {
    aTiempo: { color: '#027a35', tinta: '#fff', txt: 'A tiempo', marca: '✓' },
    tarde: { color: '#d9a21b', tinta: '#3b2a00', txt: 'Fuera de plazo', marca: '!' },
    vencido: { color: '#e5074c', tinta: '#fff', txt: 'Vencido sin atender', marca: '✕' }
  };
  var TINTA = '#2d2a2e', TINTA3 = '#7b7e80', REJILLA = '#ece4eb';

  function sv(tag, attrs) {
    var el = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined) continue;
      el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    }
    return el;
  }
  function numero(n) { return Number(n || 0).toLocaleString('es-MX'); }
  function decimal(n) { return n === null || n === undefined ? '—' : Number(n).toLocaleString('es-MX', { maximumFractionDigits: 1 }); }
  function mesLargo(m) { var p = m.split('-'); return MESES[Number(p[1]) - 1] + ' ' + p[0]; }
  function mesCorto(m, conAnio) { var p = m.split('-'); var t = MESES[Number(p[1]) - 1].slice(0, 3); t = t.charAt(0).toUpperCase() + t.slice(1); return conAnio ? t + ' ' + p[0].slice(2) : t; }
  function tope(max) {   // máximo «redondo» para el eje
    if (max <= 4) return Math.max(1, max);
    var p = Math.pow(10, Math.floor(Math.log10(max))), pasos = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < pasos.length; i++) if (pasos[i] * p >= max) return pasos[i] * p;
    return 10 * p;
  }
  /** Columna con la punta redondeada (4 px) y la base recta. */
  function columna(x, y, w, alto, color) {
    var r = Math.min(4, w / 2, alto);
    return sv('path', { d: 'M' + x + ',' + (y + alto) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + alto) + 'Z', fill: color });
  }
  /** Un solo globo de ayuda por gráfica; se muestra al pasar el mouse, al tocar o con el teclado. */
  function globo(envoltura) {
    var tip = h('div', { class: 'tip', role: 'tooltip' });
    envoltura.appendChild(tip);
    return {
      mostrar: function (x, y, contenido) {
        vaciar(tip); agregar(tip, contenido); tip.classList.add('tip--on');
        var w = tip.offsetWidth, hh = tip.offsetHeight, W = envoltura.clientWidth;
        tip.style.left = Math.max(2, Math.min(W - w - 2, x - w / 2)) + 'px';
        tip.style.top = Math.max(0, y - hh - 10) + 'px';
      },
      ocultar: function () { tip.classList.remove('tip--on'); }
    };
  }

  /**
   * Columnas por mes. datos = [{ etiqueta, valor, ayuda: Node[] }]
   * o = { color, alto, mini, nombre }
   */
  function graficaColumnas(cont, datos, o) {
    vaciar(cont);
    var W = Math.max(240, cont.clientWidth || 600), H = o.alto || 220;
    var izq = o.mini ? 26 : 36, der = 8, arriba = 18, abajo = 22;
    var pw = W - izq - der, ph = H - arriba - abajo;
    var max = tope(Math.max.apply(null, datos.map(function (d) { return d.valor; }).concat([0])));
    var y = function (v) { return arriba + ph - (v / max) * ph; };
    var banda = pw / Math.max(1, datos.length), ancho = Math.max(2, Math.min(24, banda * 0.66));
    var svg = sv('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': o.nombre || 'Gráfica', class: 'graf' });
    var marcas = o.mini ? [0, max] : [0, max / 2, max];
    marcas.forEach(function (v) {
      svg.appendChild(sv('line', { x1: izq, x2: W - der, y1: y(v), y2: y(v), stroke: REJILLA, 'stroke-width': 1, 'shape-rendering': 'crispEdges' }));
      svg.appendChild(sv('text', { x: izq - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: TINTA3 }, numero(v)));
    });
    var iMax = -1, vMax = -1;
    datos.forEach(function (d, i) { if (d.valor > vMax) { vMax = d.valor; iMax = i; } });
    var cadaCuanto = o.mini ? Math.max(1, datos.length - 1) : Math.ceil(datos.length / Math.max(1, Math.floor(pw / 42)));
    var tip = globo(cont);
    datos.forEach(function (d, i) {
      var cx = izq + banda * i + banda / 2;
      if (d.valor > 0) svg.appendChild(columna(cx - ancho / 2, y(d.valor), ancho, arriba + ph - y(d.valor), o.color));

      descargarBytes(ExcelCG.libro(hojas), 'Informes Control de Gestión ' + d.desde + ' a ' + d.hasta + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    }).catch(fallo);
  }
</script>

<style>
/* ════════════════════════════════════════════════════════════════════
   Control de Gestión · Estilos
   Identidad CDMX 2024-2030 (la misma de Gabinetes de Paz): morado
   Pantone 258 C como primario, guinda y dorado de acento, Cabin para
   títulos y Roboto para el contenido.
   ════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Paleta del Manual de Identidad CDMX 2024-2030 (valores exactos) ──
     Principales: dorado y guinda. El resto "refleja biodiversidad,
     inclusión y vida". Las tarjetas usan SOLO estos colores. */
  --color-dorado: #b28e5c;    /* Pantone 465 C  */
  --color-guinda: #9d2148;    /* Pantone 7420 C */
  --color-amarillo: #fdc60a;  /* Pantone 7548 C */
  --color-naranja: #f08217;   /* Pantone 151 C  */
  --color-cafe: #ac6d14;      /* Pantone 146 C  */
  --color-rosa: #f5aeb8;      /* Pantone 176 C  */
  --color-magenta: #d72f89;   /* Pantone 225 C  */
  --color-rojo: #e5074c;      /* Pantone 1925 C */
  --color-azul-claro: #73cae6;/* Pantone 0821 C */
  --color-azul: #266cb4;      /* Pantone 285 C  */
  --color-morado: #8f4889;    /* Pantone 258 C  */
  --color-verde: #027a35;     /* Pantone 356 C  */
  --color-gris: #55585a;      /* Pantone 425 C  */
  --color-marfil: var(--color-marfil);    /* Pantone P 1-2 U */

  /* ── Usos en la interfaz (salen de la paleta) ── */
  --morado: var(--color-morado);
  --morado-osc: #6f3369;      /* morado al pasar el mouse */
  --morado-claro: #f4ebf3;
  --lavanda: #f8f2f7;
  --guinda: var(--color-guinda);
  --dorado: var(--color-dorado);
  --dorado-claro: #f6efe4;
  --texto: #2d2a2e;
  --texto-2: var(--color-gris);
  --texto-3: #7b7e80;
  --borde: #e2d6e0;
  --borde-2: #cdbccb;
  --fondo: #faf8fa;
  --blanco: #ffffff;
  --verde: var(--color-verde);
  --verde-claro: #e3f3e9;
  --rojo: var(--color-rojo);
  --rojo-claro: #fde8ee;
  --amarillo-texto: #8a5a00;  /* texto sobre fondo amarillo claro (el amarillo puro no se lee sobre blanco) */
  --amarillo-claro: #fff4d6;
  --azul: var(--color-azul);
  --azul-claro: #e6f0fa;
  --gris-claro: #eff0f1;
  --radio: 10px;
  --sombra: 0 1px 2px rgba(45, 20, 43, .06), 0 4px 16px rgba(45, 20, 43, .06);
  --sombra-alta: 0 12px 40px rgba(45, 20, 43, .22);
  --titulo: "Cabin", system-ui, sans-serif;
  --cuerpo: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--cuerpo); font-size: 14px; line-height: 1.45; color: var(--texto); background: var(--fondo); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--titulo); margin: 0; letter-spacing: -.01em; }
a { color: var(--morado); }
:focus-visible { outline: 3px solid rgba(143, 72, 137, .45); outline-offset: 2px; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── Barra de progreso y arranque ─────────────────────────────── */
.progreso { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, var(--dorado), var(--morado)); z-index: 100; transition: width .3s, opacity .3s; opacity: 0; }
.progreso.activo { width: 85%; opacity: 1; transition: width 8s cubic-bezier(.1, .7, .2, 1); }
.arranque { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 6px; }
.arranque__marca { font-family: var(--titulo); font-size: 22px; color: var(--morado); font-weight: 700; }
.arranque__txt { color: var(--texto-3); }

/* ── Botones y campos ─────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--borde-2); background: var(--blanco); color: var(--texto); border-radius: 8px; padding: 8px 14px; font-weight: 500; cursor: pointer; white-space: nowrap; min-height: 38px; transition: background .15s, border-color .15s; text-decoration: none; }
.btn:hover { background: var(--lavanda); border-color: var(--morado); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn--prim { background: var(--morado); border-color: var(--morado); color: #fff; }
.btn--prim:hover { background: var(--morado-osc); border-color: var(--morado-osc); }
.btn--peligro { color: var(--rojo); border-color: #efb3c4; }
.btn--peligro:hover { background: var(--rojo-claro); border-color: var(--rojo); }
.btn--peligro-lleno { background: var(--rojo); border-color: var(--rojo); color: #fff; }
.btn--fantasma { border-color: transparent; background: transparent; }
.btn--fantasma:hover { background: var(--lavanda); border-color: transparent; }
.btn--chico { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.icono-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; color: var(--texto-2); }
.icono-btn:hover { background: var(--lavanda); color: var(--morado); }
.icono-btn svg { width: 18px; height: 18px; }

.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo > label, .campo__et { font-size: 12.5px; font-weight: 500; color: var(--texto-2); }
.campo__ayuda { font-size: 12px; color: var(--texto-3); }
.campo__error { font-size: 12px; color: var(--rojo); }
.entrada, select.entrada, textarea.entrada { width: 100%; border: 1px solid var(--borde-2); border-radius: 8px; padding: 8px 10px; background: var(--blanco); min-height: 38px; transition: border-color .15s, box-shadow .15s; }
.entrada:focus { outline: none; border-color: var(--morado); box-shadow: 0 0 0 3px rgba(143, 72, 137, .15); }
textarea.entrada { resize: vertical; min-height: 64px; line-height: 1.4; }
.entrada[readonly] { background: var(--gris-claro); color: var(--texto-2); }
.casilla { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; min-height: 38px; }
.casilla input { width: 18px; height: 18px; accent-color: var(--morado); }

/* ── Entrada (login), de la misma familia que Gabinetes ────────── */
.login { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  background: radial-gradient(120% 70% at 50% -10%, rgba(143, 72, 137, .38), transparent 60%),
    radial-gradient(80% 50% at 100% 100%, rgba(143, 72, 137, .12), transparent 55%), var(--color-marfil); }
.login__card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; border-top: 5px solid var(--morado);
  box-shadow: 0 18px 48px rgba(143, 72, 137, .22), 0 3px 10px rgba(0, 0, 0, .05); padding: 32px 26px 26px; text-align: center; }
.login__eyebrow { margin: 0 0 18px; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--morado); }
.login__logo { width: 96px; height: 96px; margin: 0 auto 16px; display: block; }
.login__titulo { margin: 0 0 6px; font-size: 30px; line-height: 1.2; color: var(--morado); }
.login__sub { margin: 0 0 22px; color: var(--texto-2); font-size: 15px; }
.login__form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
.lcampo { display: flex; flex-direction: column; gap: 6px; }
.lcampo__label { font-size: 13.5px; font-weight: 600; color: var(--texto); }
.lcampo__caja { position: relative; display: block; }
.lcampo__input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid #d3b6d0; border-radius: 10px; background: #fff;
  font-size: 16px; /* 16px exactos: con menos, el iPhone hace zoom al escribir */ transition: border-color .15s, box-shadow .15s; }
.lcampo__input--ojo { padding-right: 52px; }
.lcampo__input::placeholder { color: #a9a2aa; }
.lcampo__input:focus { outline: none; border-color: var(--morado); box-shadow: 0 0 0 3px rgba(143, 72, 137, .22); }
.lcampo__input--mal { border-color: var(--rojo); }
.lcampo__ojo { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: grid; place-items: center;
  background: transparent; border: 0; border-radius: 8px; color: var(--texto-2); cursor: pointer; }
.lcampo__ojo svg { width: 20px; height: 20px; }
.lcampo__ojo:hover { color: var(--morado); }
.lcampo__mayus, .lcampo__error { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.lcampo__mayus { color: var(--amarillo-texto); }
.lcampo__mayus svg { width: 14px; height: 14px; }
.lcampo__error { color: #a5063a; }
.login__recordar { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--texto-2); cursor: pointer; user-select: none; min-height: 32px; }
.login__recordar input { width: 18px; height: 18px; accent-color: var(--morado); }
.login__error, .login__info { margin: 0; padding: 11px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.4; }
.login__error { background: #fdecf1; border: 1px solid var(--rojo-claro); color: #a5063a; }
.login__info { background: var(--azul-claro); color: #174d84; }
.login__aviso { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 0 0 16px; padding: 10px 12px; border-radius: 10px;
  background: var(--amarillo-claro); color: var(--amarillo-texto); font-size: 13.5px; }
.login__aviso svg { width: 18px; height: 18px; }
.login__boton { min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px;
  background: var(--morado); color: #fff; font-family: var(--titulo); font-size: 16.5px; font-weight: 700; cursor: pointer;
  transition: background .15s, transform .08s; margin-top: 4px; }
.login__boton:hover:not(:disabled) { background: var(--morado-osc); }
.login__boton:active:not(:disabled) { transform: translateY(1px); }
.login__boton:disabled { background: #b9a6b7; cursor: wait; }
.login__spinner { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; border-radius: 999px; animation: girar .7s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.login__ayuda { margin: 22px 0 0; font-size: 12.5px; color: var(--texto-3); }
.login__pie { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.login__pie::before { content: ""; width: 44px; height: 3px; margin-bottom: 10px; border-radius: 999px; background: var(--morado); }
.login__pie-1 { font-size: 12.5px; font-weight: 600; color: var(--morado-osc); }
.login__pie-2 { font-size: 12.5px; color: var(--morado); }
.modal-clave .login__boton { margin-top: 6px; }
@media (max-width: 767px) {
  .login { justify-content: flex-start; padding-top: 32px; }
  .login__card { padding: 24px 20px 22px; box-shadow: 0 8px 24px rgba(143, 72, 137, .16); }
  .login__titulo { font-size: 25px; }
}
@media (prefers-reduced-motion: reduce) { .login__spinner { animation-duration: 2s; } .login__boton, .lcampo__input { transition: none; } }
.alerta { border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.alerta--error { background: var(--rojo-claro); color: #8a0a2e; }
.alerta--info { background: var(--azul-claro); color: #174d84; }
.alerta--ok { background: var(--verde-claro); color: #04542a; }
.alerta--aviso { background: var(--amarillo-claro); color: var(--amarillo-texto); }
.reglas { list-style: none; padding: 0; margin: 0; font-size: 12.5px; color: var(--texto-3); display: grid; gap: 2px; }
.reglas li::before { content: "○ "; }
.reglas li.ok { color: var(--verde); }
.reglas li.ok::before { content: "● "; }

/* ── Estructura ───────────────────────────────────────────────── */
.principal { max-width: 1400px; margin: 0 auto; padding: 20px; }
.titulo-vista { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.titulo-vista h1 { font-size: 22px; color: var(--texto); }
.titulo-vista .sub { color: var(--texto-3); font-size: 13px; }
.titulo-vista__esp { flex: 1; }
.avatar { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 999px; background: var(--morado); color: #fff; font-size: 12.5px; font-weight: 700; }

/* Colores de las tarjetas y de cada pantalla: exactos del manual CDMX 2024-2030. */
.ptarjeta--morado, .modulo--morado { --c: var(--color-morado); --c-sombra: 143 72 137; }
.ptarjeta--verde, .modulo--verde { --c: var(--color-verde); --c-sombra: 2 122 53; }
.ptarjeta--azul, .modulo--azul { --c: var(--color-azul); --c-sombra: 38 108 180; }
.ptarjeta--guinda, .modulo--guinda { --c: var(--color-guinda); --c-sombra: 157 33 72; }
.ptarjeta--cafe, .modulo--cafe { --c: var(--color-cafe); --c-sombra: 172 109 20; }
.ptarjeta--magenta, .modulo--magenta { --c: var(--color-magenta); --c-sombra: 215 47 137; }

/* ═══ Portal (igual que Gabinetes) ═══ */
.portal { min-height: 100vh; display: flex; flex-direction: column;
  background: radial-gradient(120% 55% at 50% 0%, rgba(143, 72, 137, .10), transparent 60%), #f6f4f8; }
.pcab { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 12px 24px; background: rgba(255, 255, 255, .85); border-bottom: 1px solid rgba(143, 72, 137, .12); backdrop-filter: blur(10px); }
.pcab__marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pcab__logo { width: 42px; height: 42px; flex: none; object-fit: contain; display: block; }
.pcab__txt { display: flex; flex-direction: column; gap: 1px; max-width: min(100%, 34rem); min-width: 0; }
.pcab__org { margin: 0; font-family: var(--titulo); font-weight: 700; font-size: 16px; color: #2c2230; }
.pcab__sub { margin: 0; font-size: 12px; line-height: 1.35; color: var(--texto-2); }
.pcab__user { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pcab__nombre { font-size: 14px; color: var(--texto); }
.pcab__nivel { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--morado-claro); color: var(--morado); }
.pcab__instalar { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--morado); color: #fff; font-weight: 600; font-size: 12.5px; margin-right: 6px; }
.pcab__instalar svg { width: 15px; height: 15px; }
.pcab__instalar:hover { background: var(--morado-osc); }
.pcab__salir { min-height: 38px; padding: 0 16px; font-size: 13.5px; color: var(--morado); background: transparent; border: 1px solid #c9a3c5; border-radius: 8px; cursor: pointer; transition: background .2s, color .2s; }
.pcab__salir:hover { background: var(--morado); border-color: var(--morado); color: #fff; }
.principal--portal { width: 100%; max-width: 1180px; padding: 40px 24px 48px; }
.hero { margin-bottom: 32px; }
.hero__eyebrow { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--morado); }
.hero__t { margin: 0 0 8px; font-family: var(--titulo); font-weight: 700; font-size: clamp(30px, 5vw, 43px); line-height: 1.08; color: #2c2230; }
.hero__s { margin: 0; font-size: 15.5px; color: var(--texto-2); }
.pav { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin: 0 0 28px; padding: 14px 18px; border-radius: 14px; cursor: pointer;
  border: 1px solid #efb3c4; background: var(--rojo-claro); color: #7a0b2c; }
.pav > span:first-child svg { width: 24px; height: 24px; }
.pav__txt { flex: 1; display: grid; gap: 2px; }
.pav__txt strong { font-weight: 600; font-size: 15px; }
.pav__txt small { font-size: 12.5px; opacity: .85; }
.pav:hover { border-color: var(--rojo); }
.bloque { margin-bottom: 32px; }
.bloque__cab { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
.bloque__t { margin: 0; flex: 1; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--texto-2); }
.bloque__accion { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--morado); font-weight: 500; font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.bloque__accion svg { width: 15px; height: 15px; }
.bloque__accion:hover { background: var(--morado-claro); }
.rejilla-portal, .portal .rejilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.ptarjeta { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 5px; min-height: 180px; padding: 20px 16px 16px; border-radius: 14px;
  border: 0; text-align: left; font: inherit; cursor: pointer; color: #fff; overflow: hidden;
  background: var(--c); box-shadow: 0 8px 24px rgb(var(--c-sombra) / .28); transition: transform .22s ease, box-shadow .22s ease; }
.ptarjeta:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgb(var(--c-sombra) / .42); }
.ptarjeta:focus-visible { outline: 3px solid #2c2230; outline-offset: 3px; }
.ptarjeta__fila { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
.ptarjeta__ico { width: 40px; height: 40px; display: grid; place-items: center; }
.ptarjeta__ico svg { width: 26px; height: 26px; stroke-width: 1.7; }
.ptarjeta__ir { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 999px; background: rgba(255, 255, 255, .18); transition: transform .22s, background .22s; }
.ptarjeta__ir svg { width: 15px; height: 15px; }
.ptarjeta:hover .ptarjeta__ir { transform: translate(2px, -2px); background: rgba(255, 255, 255, .3); }
.ptarjeta__t { font-family: var(--titulo); font-weight: 600; font-size: 17.5px; line-height: 1.2; }
.ptarjeta__d { flex: 1; font-size: 13.5px; line-height: 1.45; opacity: .88; }
.ptarjeta__chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip { padding: 3px 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border-radius: 999px; background: rgba(255, 255, 255, .16); }
.pie { border-top: 1px solid rgba(143, 72, 137, .12); padding: 20px 24px; text-align: center; font-size: 12.5px; color: var(--texto-2); margin-top: auto; }

/* ═══ Pantallas internas: encabezado con "← Inicio" ═══ */
.modulo { min-height: 100vh; background: #faf8fa; }
.mcab { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 20px;
  background: rgba(255, 255, 255, .92); border-bottom: 1px solid rgba(143, 72, 137, .14); backdrop-filter: blur(10px); }
.mcab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--c); }
.mcab__volver { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 10px 0 6px; border: 0; background: transparent; border-radius: 8px;
  color: var(--morado); font-weight: 600; font-size: 14px; cursor: pointer; }
.mcab__volver svg { width: 18px; height: 18px; }
.mcab__volver:hover { background: var(--morado-claro); }
.mcab__marca { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: none; cursor: pointer;
  font-family: var(--titulo); font-weight: 700; font-size: 15.5px; color: #2c2230; }
.mcab__marca img { width: 28px; height: 28px; }
.mcab__yo { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-2); }
.mcab__yo .avatar { width: 30px; height: 30px; font-size: 11.5px; }

/* Franja de la libreta: su color, su ícono, sus números */
.lib { background: var(--c); color: #fff; border-radius: 16px; padding: 20px 22px; margin-bottom: 16px; box-shadow: 0 10px 28px rgb(var(--c-sombra) / .25); }
.lib__fila { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lib__ico { width: 52px; height: 52px; border-radius: 14px; background: rgba(255, 255, 255, .16); display: grid; place-items: center; flex: none; }
.lib__ico svg { width: 28px; height: 28px; stroke-width: 1.7; }
.lib__txt { flex: 1; min-width: 220px; }
.lib__t { font-size: 26px; line-height: 1.15; color: #fff; }
.lib__d { margin: 4px 0 0; font-size: 13.5px; opacity: .9; }
.lib__acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.btn--claro { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .45); color: #fff; }
.btn--claro:hover { background: rgba(255, 255, 255, .26); border-color: #fff; }
.btn--blanco { background: #fff; border-color: #fff; color: var(--c); font-weight: 600; }
.btn--blanco:hover { background: #f6eef5; border-color: #fff; }
.lib__ind { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 18px; }
.ind { display: grid; gap: 2px; text-align: left; padding: 10px 14px; border-radius: 12px; cursor: pointer; color: #fff;

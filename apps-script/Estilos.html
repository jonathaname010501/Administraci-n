<style>
/* ════════════════════════════════════════════════════════════════════
   Control de Gestión · Estilos
   Identidad CDMX 2024-2030 (la misma de Gabinetes de Paz): morado
   Pantone 258 C como primario, guinda y dorado de acento, Cabin para
   títulos y Roboto para el contenido.
   ════════════════════════════════════════════════════════════════════ */
:root {
  --morado: #8f4889;
  --morado-osc: #6f3369;
  --morado-claro: #f4ebf3;
  --lavanda: #f8f2f7;
  --guinda: #9d2148;
  --dorado: #b28e5c;
  --dorado-claro: #f6efe4;
  --texto: #2d2a2e;
  --texto-2: #55585a;
  --texto-3: #7b7e80;
  --borde: #e2d6e0;
  --borde-2: #cdbccb;
  --fondo: #faf8fa;
  --blanco: #ffffff;
  --verde: #027a35;
  --verde-claro: #e3f3e9;
  --rojo: #c4103f;
  --rojo-claro: #fde8ee;
  --amarillo: #8a5a00;
  --amarillo-claro: #fff4d6;
  --azul: #266cb4;
  --azul-claro: #e6f0fa;
  --gris-claro: #eff0f1;
  --radio: 10px;
  --sombra: 0 1px 2px rgba(45, 20, 43, .06), 0 4px 16px rgba(45, 20, 43, .06);
  --sombra-alta: 0 12px 40px rgba(45, 20, 43, .22);
  --titulo: "Cabin", system-ui, sans-serif;
  --cuerpo: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--cuerpo); font-size: 14px; line-height: 1.45; color: var(--texto); background: var(--fondo); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--titulo); margin: 0; letter-spacing: -.01em; }
a { color: var(--morado); }
:focus-visible { outline: 3px solid rgba(143, 72, 137, .45); outline-offset: 2px; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── Barra de progreso y arranque ─────────────────────────────── */
.progreso { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, var(--dorado), var(--morado)); z-index: 100; transition: width .3s, opacity .3s; opacity: 0; }
.progreso.activo { width: 85%; opacity: 1; transition: width 8s cubic-bezier(.1, .7, .2, 1); }
.arranque { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 6px; }
.arranque__marca { font-family: var(--titulo); font-size: 22px; color: var(--morado); font-weight: 700; }
.arranque__txt { color: var(--texto-3); }

/* ── Botones y campos ─────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--borde-2); background: var(--blanco); color: var(--texto); border-radius: 8px; padding: 8px 14px; font-weight: 500; cursor: pointer; white-space: nowrap; min-height: 38px; transition: background .15s, border-color .15s; text-decoration: none; }
.btn:hover { background: var(--lavanda); border-color: var(--morado); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn--prim { background: var(--morado); border-color: var(--morado); color: #fff; }
.btn--prim:hover { background: var(--morado-osc); border-color: var(--morado-osc); }
.btn--peligro { color: var(--rojo); border-color: #efb3c4; }
.btn--peligro:hover { background: var(--rojo-claro); border-color: var(--rojo); }
.btn--peligro-lleno { background: var(--rojo); border-color: var(--rojo); color: #fff; }
.btn--fantasma { border-color: transparent; background: transparent; }
.btn--fantasma:hover { background: var(--lavanda); border-color: transparent; }
.btn--chico { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.icono-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; color: var(--texto-2); }
.icono-btn:hover { background: var(--lavanda); color: var(--morado); }
.icono-btn svg { width: 18px; height: 18px; }

.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo > label, .campo__et { font-size: 12.5px; font-weight: 500; color: var(--texto-2); }
.campo__ayuda { font-size: 12px; color: var(--texto-3); }
.campo__error { font-size: 12px; color: var(--rojo); }
.entrada, select.entrada, textarea.entrada { width: 100%; border: 1px solid var(--borde-2); border-radius: 8px; padding: 8px 10px; background: var(--blanco); min-height: 38px; transition: border-color .15s, box-shadow .15s; }
.entrada:focus { outline: none; border-color: var(--morado); box-shadow: 0 0 0 3px rgba(143, 72, 137, .15); }
textarea.entrada { resize: vertical; min-height: 64px; line-height: 1.4; }
.entrada[readonly] { background: var(--gris-claro); color: var(--texto-2); }
.casilla { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; min-height: 38px; }
.casilla input { width: 18px; height: 18px; accent-color: var(--morado); }

/* ── Entrada (login) ──────────────────────────────────────────── */
.login { min-height: 100vh; display: grid; grid-template-columns: 1fr; background:
  radial-gradient(1200px 500px at 110% -10%, rgba(178, 142, 92, .18), transparent 60%),
  radial-gradient(900px 500px at -10% 110%, rgba(143, 72, 137, .16), transparent 60%), var(--fondo); }
.login__caja { margin: auto; width: min(420px, calc(100vw - 32px)); background: var(--blanco); border-radius: 16px; box-shadow: var(--sombra-alta); overflow: hidden; }
.login__cab { background: var(--morado); color: #fff; padding: 22px 26px 18px; position: relative; }
.login__cab::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--dorado), var(--guinda)); }
.login__dep { font-size: 12px; opacity: .85; line-height: 1.35; }
.login__titulo { font-family: var(--titulo); font-size: 24px; font-weight: 700; margin-top: 10px; }
.login__cuerpo { padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 14px; }
.login__pie { font-size: 12px; color: var(--texto-3); text-align: center; padding: 0 26px 18px; }
.clave-envoltura { position: relative; }
.clave-envoltura .entrada { padding-right: 42px; }
.clave-envoltura .icono-btn { position: absolute; right: 2px; top: 2px; }
.alerta { border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.alerta--error { background: var(--rojo-claro); color: #8a0a2e; }
.alerta--info { background: var(--azul-claro); color: #174d84; }
.alerta--ok { background: var(--verde-claro); color: #04542a; }
.alerta--aviso { background: var(--amarillo-claro); color: var(--amarillo); }
.reglas { list-style: none; padding: 0; margin: 0; font-size: 12.5px; color: var(--texto-3); display: grid; gap: 2px; }
.reglas li::before { content: "○ "; }
.reglas li.ok { color: var(--verde); }
.reglas li.ok::before { content: "● "; }

/* ── Estructura ───────────────────────────────────────────────── */
.barra { background: var(--morado); color: #fff; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 10px rgba(60, 20, 55, .18); }
.barra::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, var(--dorado), var(--guinda) 70%); }
.barra__fila { display: flex; align-items: center; gap: 16px; padding: 10px 20px; max-width: 1400px; margin: 0 auto; }
.barra__marca { display: flex; flex-direction: column; min-width: 0; }
.barra__titulo { font-family: var(--titulo); font-weight: 700; font-size: 18px; line-height: 1.1; }
.barra__dep { font-size: 11.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra__esp { flex: 1; }
.barra__yo { text-align: right; font-size: 12.5px; line-height: 1.25; }
.barra__yo strong { display: block; font-weight: 500; font-size: 13.5px; }
.barra__yo span { opacity: .8; }
.barra .icono-btn { color: #fff; }
.barra .icono-btn:hover { background: rgba(255, 255, 255, .14); color: #fff; }
.nav { background: var(--blanco); border-bottom: 1px solid var(--borde); position: sticky; top: 61px; z-index: 19; }
.nav__fila { display: flex; gap: 2px; padding: 0 14px; max-width: 1400px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.nav__fila::-webkit-scrollbar { display: none; }
.nav__i { border: 0; background: none; padding: 12px 12px 10px; display: inline-flex; gap: 7px; align-items: center; color: var(--texto-2); font-weight: 500; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.nav__i svg { width: 17px; height: 17px; }
.nav__i:hover { color: var(--morado); }
.nav__i.activo { color: var(--morado); border-bottom-color: var(--morado); }
.nav__num { background: var(--guinda); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; min-width: 18px; text-align: center; line-height: 18px; }
.principal { max-width: 1400px; margin: 0 auto; padding: 20px; }
.titulo-vista { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.titulo-vista h1 { font-size: 22px; color: var(--texto); }
.titulo-vista .sub { color: var(--texto-3); font-size: 13px; }
.titulo-vista__esp { flex: 1; }

/* ── Libretas (chips) ─────────────────────────────────────────── */
.libretas { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: thin; }
.libreta { border: 1px solid var(--borde); background: var(--blanco); border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: left; min-width: 150px; flex: none; transition: border-color .15s, box-shadow .15s, background .15s; }
.libreta:hover { border-color: var(--morado); }
.libreta__n { font-family: var(--titulo); font-size: 22px; font-weight: 700; color: var(--morado); line-height: 1.1; }
.libreta__t { font-size: 12.5px; color: var(--texto-2); }
.libreta.activa { background: var(--morado); border-color: var(--morado); box-shadow: var(--sombra); }
.libreta.activa .libreta__n, .libreta.activa .libreta__t { color: #fff; }

/* ── Herramientas y tabla ─────────────────────────────────────── */
.herr { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.herr .buscador { flex: 1 1 260px; position: relative; }
.buscador svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--texto-3); pointer-events: none; }
.buscador .entrada { padding-left: 34px; }
.herr select.entrada { width: auto; min-width: 120px; }
.herr input[type=date].entrada { width: auto; flex: 0 0 170px; }
.tarjeta { background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); }
.tabla-env { overflow-x: auto; }
.tabla { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabla th { text-align: left; font-weight: 500; font-size: 12px; color: var(--texto-2); background: var(--lavanda); padding: 9px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; position: sticky; top: 0; }
.tabla td { padding: 9px 10px; border-bottom: 1px solid #f0e8ef; vertical-align: top; }
.tabla tbody tr { cursor: pointer; transition: background .1s; }
.tabla tbody tr:hover { background: #fcf7fb; }
.tabla tbody tr.cancelado td { color: var(--texto-3); }
.tabla tbody tr.cancelado .t-asunto { text-decoration: line-through; }
.t-num { font-family: var(--titulo); font-weight: 700; color: var(--morado); white-space: nowrap; }
.t-folio { font-size: 12.5px; color: var(--texto-2); white-space: nowrap; }
.t-asunto { max-width: 520px; }
.t-asunto__obs { display: block; font-size: 12px; color: var(--texto-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 520px; }
.t-persona { max-width: 280px; font-size: 13px; }
.t-persona small { display: block; color: var(--texto-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-fecha { white-space: nowrap; }
.t-iconos { white-space: nowrap; color: var(--texto-3); }
.t-iconos svg { width: 15px; height: 15px; vertical-align: -3px; }
.t-iconos .si { color: var(--verde); }
.vacio { padding: 40px 20px; text-align: center; color: var(--texto-3); }
.vacio strong { display: block; color: var(--texto-2); font-size: 15px; margin-bottom: 4px; }
.mas { display: flex; justify-content: center; padding: 12px; }
.conteo { font-size: 12.5px; color: var(--texto-3); margin: 0 0 8px; }

/* Insignias */
.ins { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--gris-claro); color: var(--texto-2); }
.ins--Pendiente { background: var(--amarillo-claro); color: var(--amarillo); }
.ins--En-trámite { background: var(--azul-claro); color: #174d84; }
.ins--Atendido { background: var(--verde-claro); color: #04542a; }
.ins--Concluido { background: #e9eef0; color: #2f4a55; }
.ins--Cancelado { background: var(--rojo-claro); color: #8a0a2e; }
.ins--vencido { background: var(--rojo); color: #fff; }
.ins--hoy { background: var(--guinda); color: #fff; }
.ins--pronto { background: var(--dorado-claro); color: #7a5a2a; }

/* Tarjetas en celular en lugar de tabla */
.lista-movil { display: none; }
.item { padding: 12px 14px; border-bottom: 1px solid #f0e8ef; display: grid; gap: 4px; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item__arriba { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item__asunto { font-weight: 500; }
.item__meta { font-size: 12.5px; color: var(--texto-3); }

/* ── Panel de detalle ─────────────────────────────────────────── */
.velo { position: fixed; inset: 0; background: rgba(35, 15, 33, .38); z-index: 40; animation: aparece .15s ease-out; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--blanco); z-index: 41; box-shadow: var(--sombra-alta); display: flex; flex-direction: column; animation: entra .2s ease-out; }
@keyframes entra { from { transform: translateX(30px); opacity: 0; } }
@keyframes aparece { from { opacity: 0; } }
.panel__cab { padding: 16px 20px 12px; border-bottom: 1px solid var(--borde); display: flex; gap: 12px; align-items: flex-start; }
.panel__tipo { font-size: 12px; color: var(--texto-3); text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
.panel__num { font-family: var(--titulo); font-size: 22px; font-weight: 700; color: var(--morado); line-height: 1.15; }
.panel__folio { font-size: 13px; color: var(--texto-2); word-break: break-word; }
.panel__acciones { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--borde); background: var(--lavanda); }
.panel__cuerpo { padding: 16px 20px 30px; overflow-y: auto; flex: 1; display: grid; gap: 18px; align-content: start; }
.seccion h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--morado); margin-bottom: 8px; font-weight: 600; }
.datos { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; margin: 0; }
.datos dt { color: var(--texto-3); font-size: 12.5px; padding-top: 1px; }
.datos dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
.datos dd.vacio-dd { color: var(--texto-3); }
.archivo { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--borde-2); border-radius: 10px; padding: 10px 12px; flex-wrap: wrap; }
.archivo__ico { width: 34px; height: 34px; border-radius: 8px; background: var(--morado-claro); color: var(--morado); display: grid; place-items: center; flex: none; }
.archivo__ico svg { width: 18px; height: 18px; }
.archivo__txt { flex: 1; min-width: 140px; }
.archivo__txt strong { display: block; font-weight: 500; font-size: 13px; }
.archivo__txt span { font-size: 12px; color: var(--texto-3); word-break: break-all; }
.archivo.tiene { border-style: solid; background: #fdfafd; }
.historial { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.historial li { font-size: 12.5px; border-left: 3px solid var(--borde); padding: 2px 0 2px 10px; }
.historial li strong { font-weight: 500; }
.historial li span { color: var(--texto-3); }
.historial li div { color: var(--texto-2); word-break: break-word; }
.ligado { display: flex; gap: 8px; align-items: center; border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: var(--blanco); width: 100%; text-align: left; }
.ligado:hover { border-color: var(--morado); }
.cancelacion { background: var(--rojo-claro); color: #8a0a2e; border-radius: 8px; padding: 10px 12px; font-size: 13px; }

/* ── Modal y formulario ───────────────────────────────────────── */
.modal { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(var(--ancho, 720px), calc(100vw - 24px)); max-height: calc(100vh - 24px); background: var(--blanco); border-radius: 14px; box-shadow: var(--sombra-alta); display: flex; flex-direction: column; animation: sube .18s ease-out; }
@keyframes sube { from { transform: translate(-50%, -46%); opacity: 0; } }
.velo--modal { z-index: 50; }
.modal__cab { padding: 16px 20px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; gap: 10px; }
.modal__cab h2 { font-size: 18px; flex: 1; }
.modal__cuerpo { padding: 18px 20px; overflow-y: auto; display: grid; gap: 14px; }
.modal__pie { padding: 12px 20px; border-top: 1px solid var(--borde); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: #fcfafc; border-radius: 0 0 14px 14px; }
.rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.rejilla .ancho { grid-column: 1 / -1; }
.grupo { border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px 14px; }
.grupo > legend { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--morado); font-weight: 600; padding: 0 6px; }
.numero-previo { background: var(--dorado-claro); color: #6b4d22; border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.numero-previo strong { font-family: var(--titulo); }

/* Buscador de personas */
.combo { position: relative; }
.combo__lista { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--blanco); border: 1px solid var(--borde-2); border-radius: 10px; box-shadow: var(--sombra-alta); max-height: 280px; overflow-y: auto; z-index: 60; padding: 4px; }
.combo__op { padding: 7px 10px; border-radius: 7px; cursor: pointer; display: block; width: 100%; text-align: left; border: 0; background: none; }
.combo__op small { display: block; color: var(--texto-3); font-size: 11.5px; }
.combo__op.activa, .combo__op:hover { background: var(--lavanda); }
.combo__op--nueva { color: var(--morado); font-weight: 500; border-top: 1px solid var(--borde); border-radius: 0 0 7px 7px; margin-top: 2px; }
.combo__sel { font-size: 12px; color: var(--texto-3); display: flex; gap: 6px; align-items: baseline; min-height: 18px; min-width: 0; }
.combo__sel > span { flex: none; }
.combo__sel > .combo__cargo { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combo__sel .ok { color: var(--verde); }
.combo__sel .libre { color: var(--amarillo); }

/* Avisos */
.avisos { position: fixed; right: 16px; bottom: 16px; z-index: 70; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.aviso { background: var(--texto); color: #fff; border-radius: 10px; padding: 11px 14px; box-shadow: var(--sombra-alta); font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; animation: sube-aviso .2s ease-out; }
.aviso--ok { background: #0f5132; }
.aviso--error { background: #8a0a2e; }
.aviso button { margin-left: auto; color: #fff; background: none; border: 0; cursor: pointer; opacity: .8; }
@keyframes sube-aviso { from { transform: translateY(10px); opacity: 0; } }

/* Credenciales */
.cred { background: var(--dorado-claro); border: 1px solid #e3d2b6; border-radius: 10px; padding: 14px; display: grid; gap: 6px; }
.cred code { font-size: 16px; background: #fff; border-radius: 6px; padding: 2px 8px; border: 1px solid #e3d2b6; }

/* Pendientes */
.pend { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); align-items: start; }
.pend h2 { font-size: 16px; display: flex; gap: 8px; align-items: center; padding: 14px 16px 10px; }
.pend__i { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; padding: 10px 16px; border-top: 1px solid #f0e8ef; cursor: pointer; align-items: start; }
.pend__i:hover { background: #fcf7fb; }
.pend__tipo { font-size: 11.5px; color: var(--texto-3); }
.pend__asunto { grid-column: 2; }

/* Directorio, usuarios, bitácora */
.lista-simple .fila { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid #f0e8ef; }
.lista-simple .fila:first-child { border-top: 0; }
.fila__txt { flex: 1; min-width: 0; }
.fila__txt strong { font-weight: 500; display: block; }

    ping.ultimo = Date.now();
    llamar('ping', null, { silencioso: true }).then(function (r) {
      var antes = !!(E.ini.mantenimiento && E.ini.mantenimiento.activo);
      E.ini.mantenimiento = r.mantenimiento;
      if (E.vista === 'inicio' && antes !== !!(r.mantenimiento && r.mantenimiento.activo)) irA('inicio', null, { sinHistorial: true });
    }).catch(function (e) { if (e.codigo === 'PETICION') ping.apagado = true; });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') revisarSesion(false); });

  /* ───────────────────────── Avisos y ventanas ───────────────────────── */
  function aviso(texto, tipo, extra) {
    var cont = document.getElementById('avisos');
    var el = h('div', { class: 'aviso aviso--' + (tipo || 'info') }, h('div', null, texto, extra ? h('div', { style: { marginTop: '6px' } }, extra) : null),
      h('button', { 'aria-label': 'Cerrar aviso', onclick: function () { el.remove(); } }, '✕'));
    cont.appendChild(el);
    // A lo más tres a la vez: si se juntan, se va el más viejo (que no sea un error)
    while (cont.children.length > 3) {
      var viejo = Array.prototype.filter.call(cont.children, function (x) { return !/aviso--error/.test(x.className); })[0] || cont.firstChild;
      viejo.remove();
    }
    setTimeout(function () { if (el.parentNode) el.remove(); }, tipo === 'error' ? 9000 : extra ? 12000 : 4500);
  }

  var pila = [];
  var ENFOCABLES = 'a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  /** Mantiene el Tab dentro de «caja» (para teclado y lectores de pantalla). */
  function atraparFoco(caja, ev) {
    if (ev.key !== 'Tab') return;
    var todos = Array.prototype.filter.call(caja.querySelectorAll(ENFOCABLES), function (x) { return x.offsetParent !== null || x === document.activeElement; });
    if (!todos.length) { ev.preventDefault(); caja.focus(); return; }
    var primero = todos[0], ultimo = todos[todos.length - 1];
    if (ev.shiftKey && (document.activeElement === primero || document.activeElement === caja)) { ev.preventDefault(); ultimo.focus(); }
    else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primero.focus(); }
    else if (!caja.contains(document.activeElement)) { ev.preventDefault(); primero.focus(); }
  }

  /**
   * Ventana (modal). o = { titulo, cuerpo, pie, ancho, sinFoco, alCerrar, antesDeCerrar,
   *  cuidar: true si tiene algo que no se debe perder (la sesión vencida no la cierra),
   *  fija: true si no se cierra con Esc ni tocando afuera }
   */
  function ventana(o) {
    var anterior = document.activeElement;
    var velo = h('div', { class: 'velo velo--modal' });
    var cuerpo = h('div', { class: 'modal__cuerpo' }, o.cuerpo);
    var pie = h('div', { class: 'modal__pie' }, o.pie || null);
    var idTitulo = 'm' + Math.random().toString(36).slice(2, 9);
    var caja = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': idTitulo, tabindex: '-1', style: { '--ancho': (o.ancho || 720) + 'px' } },
      h('div', { class: 'modal__cab' }, h('h2', { id: idTitulo }, o.titulo),
        o.fija ? null : h('button', { class: 'icono-btn', 'aria-label': 'Cerrar', onclick: function () { intentarCerrar(); } }, icono('cerrar'))),
      cuerpo, o.pie ? pie : null);
    var v = { caja: caja, cuerpo: cuerpo, pie: pie, cerrar: cerrar, alCerrar: o.alCerrar, antesDeCerrar: o.antesDeCerrar, cuidar: !!o.cuidar };
    function cerrar() {
      velo.remove(); caja.remove();
      pila = pila.filter(function (x) { return x !== v; });
      document.removeEventListener('keydown', tecla);
      if (v.alCerrar) v.alCerrar();
      // El foco regresa a donde estaba (el botón que abrió la ventana)
      if (anterior && anterior.focus && document.contains(anterior)) { try { anterior.focus(); } catch (e) { /* sin foco */ } }
    }
    function intentarCerrar() {
      if (o.fija) return;
      if (v.antesDeCerrar) Promise.resolve(v.antesDeCerrar()).then(function (s) { if (s !== false) cerrar(); });
      else cerrar();
    }
    v.intentarCerrar = intentarCerrar;
    function tecla(ev) {
      if (pila[pila.length - 1] !== v) return;
      if (ev.key === 'Escape') intentarCerrar();
      else atraparFoco(caja, ev);
    }
    velo.addEventListener('click', intentarCerrar);
    document.addEventListener('keydown', tecla);
    document.body.appendChild(velo);
    document.body.appendChild(caja);
    pila.push(v);
    var primero = caja.querySelector('input:not([type=hidden]):not([type=file]):not([readonly]), textarea, select');
    if (primero && !o.sinFoco) primero.focus(); else caja.focus();
    return v;
  }

  function confirmar(texto, o) {
    o = o || {};
    return new Promise(function (res) {
      var listo = false;
      var v = ventana({ titulo: o.titulo || 'Confirmar', ancho: 460, sinFoco: true, cuerpo: h('div', { style: { whiteSpace: 'pre-wrap' } }, texto),
        alCerrar: function () { if (!listo) res(false); },
        pie: [h('button', { class: 'btn', onclick: function () { v.cerrar(); } }, o.no || 'Cancelar'),
          h('button', { class: 'btn ' + (o.peligro ? 'btn--peligro-lleno' : 'btn--prim'), onclick: function () { listo = true; v.cerrar(); res(true); } }, o.si || 'Aceptar')] });
    });
  }

  function campo(etiqueta, control, o) {
    o = o || {};
    var objetivo = /^(INPUT|SELECT|TEXTAREA)$/.test(control.tagName) ? control : control.querySelector && control.querySelector('input, select, textarea');
    var id = null;
    if (objetivo) { if (!objetivo.id) objetivo.id = 'c' + Math.random().toString(36).slice(2, 9); id = objetivo.id; }
    return h('div', { class: 'campo' + (o.ancho ? ' ancho' : '') },
      h('label', { for: id }, etiqueta, o.req ? h('span', { style: { color: 'var(--guinda)' } }, ' *') : null),
      control, o.ayuda ? h('div', { class: 'campo__ayuda' }, o.ayuda) : null);
  }

  function insEstatus(est) {
    return h('span', { class: 'ins ins--' + String(est || 'sin').replace(/\s+/g, '-') }, est || 'Sin estatus');
  }
  function insMio() { return h('span', { class: 'ins ins--mio', title: 'Te lo turnaron a ti' }, icono('diana'), 'A ti'); }
  function insVence(r) {
    if (!r.fecha_limite || ['Atendido', 'Concluido', 'Cancelado'].indexOf(r.estatus) >= 0) return null;
    var d = diasHasta(r.fecha_limite);
    if (d < 0) return h('span', { class: 'ins ins--vencido' }, 'Vencido hace ' + (-d) + ' d');
    if (d === 0) return h('span', { class: 'ins ins--hoy' }, 'Vence hoy');
    if (d <= 3) return h('span', { class: 'ins ins--pronto' }, 'Vence en ' + d + ' d');
    return h('span', { class: 'ins' }, 'Límite ' + fechaCorta(r.fecha_limite));
  }

  function descargarBytes(bytes, nombre, mime) {
    // Sin acentos ni símbolos: algunos navegadores ignoran el nombre si los trae
    nombre = String(nombre || 'archivo').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w .()-]+/g, '_');
    var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    var a = h('a', { href: url, download: nombre, style: { display: 'none' } });
    document.body.appendChild(a);
    try { a.click(); } catch (e) { /* algunos navegadores lo bloquean */ }
    a.remove();
    aviso('Listo: ' + nombre, 'ok', h('a', { href: url, download: nombre, style: { color: '#fff', fontWeight: 500 } }, 'Si no se descargó, haz clic aquí'));
    setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
  }

  function b64aBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
</script>

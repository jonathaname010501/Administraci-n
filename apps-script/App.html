      h('label', { for: id }, etiqueta, o.req ? h('span', { style: { color: 'var(--guinda)' } }, ' *') : null),
      control, o.ayuda ? h('div', { class: 'campo__ayuda' }, o.ayuda) : null);
  }

  function insEstatus(est) {
    return h('span', { class: 'ins ins--' + String(est || 'sin').replace(/\s+/g, '-') }, est || 'Sin estatus');
  }
  function insMio() { return h('span', { class: 'ins ins--mio', title: 'Te lo turnaron a ti' }, icono('diana'), 'A ti'); }
  function insVence(r) {
    if (!r.fecha_limite || ['Atendido', 'Concluido', 'Cancelado'].indexOf(r.estatus) >= 0) return null;
    var d = diasHasta(r.fecha_limite);
    if (d < 0) return h('span', { class: 'ins ins--vencido' }, 'Vencido hace ' + (-d) + ' d');
    if (d === 0) return h('span', { class: 'ins ins--hoy' }, 'Vence hoy');
    if (d <= 3) return h('span', { class: 'ins ins--pronto' }, 'Vence en ' + d + ' d');
    return h('span', { class: 'ins' }, 'Límite ' + fechaCorta(r.fecha_limite));
  }

  function descargarBytes(bytes, nombre, mime) {
    // Sin acentos ni símbolos: algunos navegadores ignoran el nombre si los trae
    nombre = String(nombre || 'archivo').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w .()-]+/g, '_');
    var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    var a = h('a', { href: url, download: nombre, style: { display: 'none' } });
    document.body.appendChild(a);
    try { a.click(); } catch (e) { /* algunos navegadores lo bloquean */ }
    a.remove();
    aviso('Listo: ' + nombre, 'ok', h('a', { href: url, download: nombre, style: { color: '#fff', fontWeight: 500 } }, 'Si no se descargó, haz clic aquí'));
    setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
  }

  function b64aBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* ───────────────────────── Entrar ───────────────────────── */
  function encabezadoInst() {
    var enc = (E.ini && E.ini.config.encabezados) || (E.publico && E.publico.encabezados) || [];
    return enc;
  }

  // Recordar SOLO el usuario (nunca la contraseña) en este equipo, si la persona lo pide.
  function usuarioRecordado() { try { return localStorage.getItem('cg_usuario') || ''; } catch (e) { return ''; } }
  function recordarUsuario(u) { try { if (u) localStorage.setItem('cg_usuario', u); else localStorage.removeItem('cg_usuario'); } catch (e) { /* sin almacenamiento */ } }
  var esCelular = function () { return window.innerWidth < 768; };

  /** Campo de contraseña con botón para verla y aviso de Bloq Mayús. */
  function campoClave(etiqueta, o) {
    o = o || {};
    var input = h('input', { class: 'lcampo__input lcampo__input--ojo', type: 'password', autocomplete: o.autocomplete || 'current-password',
      maxlength: 128, placeholder: o.placeholder || '••••••••', enterkeyhint: o.enter || 'go', value: o.valor || '' });
    var ojo = h('button', { type: 'button', class: 'lcampo__ojo', 'aria-label': 'Ver contraseña', 'aria-pressed': 'false', onclick: function () {
      var ver = input.type === 'password';
      input.type = ver ? 'text' : 'password';
      ojo.setAttribute('aria-pressed', ver ? 'true' : 'false');
      ojo.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Ver contraseña');
      vaciar(ojo).appendChild(icono(ver ? 'ojoNo' : 'ojo'));
      input.focus();
    } }, icono('ojo'));
    var mayus = h('span', { class: 'lcampo__mayus oculto' }, icono('alerta'), 'Bloq Mayús está activado');
    var error = h('span', { class: 'lcampo__error oculto', role: 'alert' });
    function revisarMayus(ev) { if (ev.getModifierState) mayus.classList.toggle('oculto', !ev.getModifierState('CapsLock')); }
    input.addEventListener('keydown', revisarMayus);
    input.addEventListener('keyup', revisarMayus);
    input.addEventListener('blur', function () { mayus.classList.add('oculto'); });
    input.addEventListener('input', function () { error.classList.add('oculto'); input.classList.remove('lcampo__input--mal'); });
    var el = h('label', { class: 'lcampo' }, h('span', { class: 'lcampo__label' }, etiqueta),
      h('span', { class: 'lcampo__caja' }, input, ojo), mayus, error);
    return { el: el, input: input, falta: function (msg) { error.textContent = msg; error.classList.remove('oculto'); input.classList.add('lcampo__input--mal'); input.focus(); } };
  }

  function lienzoEntrada(contenido) {
    var enc = encabezadoInst();
    vaciar(app).appendChild(h('main', { class: 'login' },
      h('div', { class: 'login__card' }, contenido),
      h('footer', { class: 'login__pie' },
        enc[0] ? h('span', { class: 'login__pie-1' }, enc[0]) : null,
        enc[1] ? h('span', { class: 'login__pie-2' }, enc[1]) : null)));
  }

  function encabezadoTarjeta(titulo, sub) {
    return [h('p', { class: 'login__eyebrow' }, 'SAPCI · Ciudad de México'),
      h('img', { class: 'login__logo', src: LOGO, alt: 'Territorios de Paz e Igualdad', width: 96, height: 96 }),
      h('h1', { class: 'login__titulo' }, titulo), h('p', { class: 'login__sub' }, sub)];
  }

  function pantallaEntrar(mensaje) {
    document.title = 'Control de Gestión';
    var recordado = usuarioRecordado();
    var usuario = h('input', { class: 'lcampo__input', type: 'text', autocomplete: 'username', autocapitalize: 'none', autocorrect: 'off',
      spellcheck: 'false', maxlength: 30, placeholder: 'nombre.apellido', enterkeyhint: 'next', value: recordado });
    var errUsuario = h('span', { class: 'lcampo__error oculto', role: 'alert' });
    usuario.addEventListener('input', function () { errUsuario.classList.add('oculto'); usuario.classList.remove('lcampo__input--mal'); });
    var clave = campoClave('Contraseña');
    var recordar = h('input', { type: 'checkbox', checked: !!recordado });
    var sinRed = h('p', { class: 'login__aviso' + (navigator.onLine === false ? '' : ' oculto'), role: 'status' }, icono('sinRed'), 'No hay internet. Conéctate para poder entrar.');
    var avisoLuz = function () { sinRed.classList.toggle('oculto', navigator.onLine !== false); };
    window.addEventListener('online', avisoLuz);
    window.addEventListener('offline', avisoLuz);
    var msg = h('div', { role: 'alert' }, mensaje ? h('p', { class: 'login__info' }, mensaje) : null);
    var cajaMant = h('div', { role: 'status' });
    function pintarMant() {
      var mant = E.publico && E.publico.mantenimiento && E.publico.mantenimiento.activo ? E.publico.mantenimiento : null;
      vaciar(cajaMant);
      if (mant) cajaMant.appendChild(h('div', { class: 'login__mant' }, icono('herramienta'),
        h('div', null, h('strong', null, 'Sistema en mantenimiento'), h('p', null, mant.mensaje), h('small', null, 'Por ahora solo pueden entrar los administradores.'))));
    }
    pintarMant();
    // El aviso de mantenimiento se revisa de nuevo al mostrar esta pantalla (pudo cambiar)
    if (!E.publicoEn || Date.now() - E.publicoEn > 10000) {
      llamar('estado', null, { silencioso: true }).then(function (p) { E.publico = p; E.publicoEn = Date.now(); pintarMant(); }).catch(function () {});
    }
    var boton = h('button', { class: 'login__boton', type: 'submit' }, 'Entrar');
    function ocupado(si) {
      boton.disabled = si;
      vaciar(boton);
      if (si) boton.appendChild(h('span', { class: 'login__spinner', 'aria-hidden': 'true' }));
      boton.appendChild(document.createTextNode(si ? 'Entrando…' : 'Entrar'));
    }
    var form = h('form', { class: 'login__form', novalidate: true, onsubmit: function (ev) {
      ev.preventDefault();
      vaciar(msg);
      var u = usuario.value.trim().toLowerCase();
      if (!u) { errUsuario.textContent = 'Escribe tu usuario.'; errUsuario.classList.remove('oculto'); usuario.classList.add('lcampo__input--mal'); usuario.focus(); return; }
      if (!clave.input.value) { clave.falta('Escribe tu contraseña.'); return; }
      ocupado(true);
      llamar('entrar', { usuario: u, clave: clave.input.value }).then(function (r) {
        window.removeEventListener('online', avisoLuz);
        window.removeEventListener('offline', avisoLuz);
        recordarUsuario(recordar.checked ? u : '');
        E.token = r.token; guardarLocal('cg_token', r.token);
        E.usuarioEntrada = u;
        if (r.debe_cambiar) pantallaCambiarClave(true, clave.input.value);
        else cargarInicio();
      }).catch(function (e) {
        ocupado(false);
        if (e.codigo === 'MANTENIMIENTO') { pantallaEntrar(); return; }
        vaciar(msg).appendChild(h('p', { class: 'login__error' }, e.message));
        clave.input.value = '';
        clave.input.focus();
      });
    } },
      h('label', { class: 'lcampo' }, h('span', { class: 'lcampo__label' }, 'Usuario'), usuario, errUsuario),
      clave.el,
      h('label', { class: 'login__recordar' }, recordar, 'Recordar mi usuario en este equipo'),
      msg, boton);
    lienzoEntrada([].concat(encabezadoTarjeta('Control de Gestión', recordado ? 'Hola de nuevo. Escribe tu contraseña para continuar.' : 'Inicia sesión para continuar.'),
      [cajaMant, sinRed, form, h('p', { class: 'login__ayuda' }, '¿Olvidaste tu contraseña? Pide a un administrador que te dé una nueva.')]));
    // En celular no se abre el teclado de golpe: tapa la pantalla.
    if (!esCelular()) (recordado ? clave.input : usuario).focus();
  }

  function reglasClave(valor, usuario) {
    return [
      [valor.length >= 8, 'Al menos 8 caracteres'],
      [/[A-Za-zÁÉÍÓÚáéíóúÑñ]/.test(valor) && /\d/.test(valor), 'Letras y números'],
      [!usuario || valor.toLowerCase().indexOf(usuario.toLowerCase()) < 0, 'Que no contenga tu usuario']
    ];
  }

  function formularioClave(alTerminar, actualConocida) {
    var usuario = (E.ini && E.ini.yo.usuario) || E.usuarioEntrada || '';
    var actual = campoClave('Contraseña actual', { valor: actualConocida || '', enter: 'next' });
    var nueva = campoClave('Contraseña nueva', { autocomplete: 'new-password', enter: 'next', placeholder: 'Mínimo 8, con letras y números' });
    var repite = campoClave('Repítela', { autocomplete: 'new-password', placeholder: 'Escríbela otra vez' });
    var lista = h('ul', { class: 'reglas' });
    var msg = h('div', { role: 'alert' });
    function pintar() {
      vaciar(lista);
      reglasClave(nueva.input.value, usuario).concat([[nueva.input.value && nueva.input.value === repite.input.value, 'Las dos coinciden']]).forEach(function (r) {
        lista.appendChild(h('li', { class: r[0] ? 'ok' : '' }, r[1]));
      });
    }
    nueva.input.addEventListener('input', pintar); repite.input.addEventListener('input', pintar); pintar();
    var boton = h('button', { class: 'login__boton', type: 'submit' }, 'Guardar contraseña');
    var form = h('form', { class: 'login__form', novalidate: true, onsubmit: function (ev) {
      ev.preventDefault();
      vaciar(msg);
      if (!actualConocida && !actual.input.value) { actual.falta('Escribe tu contraseña actual.'); return; }
      var fallas = reglasClave(nueva.input.value, usuario).filter(function (r) { return !r[0]; });
      if (fallas.length) { nueva.falta('Le falta: ' + fallas.map(function (r) { return r[1].toLowerCase(); }).join(', ') + '.'); return; }
      if (nueva.input.value !== repite.input.value) { repite.falta('No coincide con la nueva.'); return; }
      boton.disabled = true; boton.textContent = 'Guardando…';
      llamar('cambiarClave', { actual: actualConocida || actual.input.value, nueva: nueva.input.value }).then(function (r) {
        E.token = r.token; guardarLocal('cg_token', r.token);
        aviso('Contraseña actualizada.', 'ok');
        alTerminar();
      }).catch(function (e) { boton.disabled = false; boton.textContent = 'Guardar contraseña'; vaciar(msg).appendChild(h('p', { class: 'login__error' }, e.message)); });
    } }, actualConocida ? null : actual.el, nueva.el, lista, repite.el, msg, boton);
    return form;
  }

  function pantallaCambiarClave(forzada, temporal) {
    if (!forzada) {
      var v = ventana({ titulo: 'Cambiar mi contraseña', ancho: 440, cuerpo: h('div', { class: 'modal-clave' }, formularioClave(function () { v.cerrar(); })) });
      return;
    }
    lienzoEntrada([].concat(encabezadoTarjeta('Crea tu contraseña', 'Tu contraseña es temporal. Elige una que solo tú conozcas.'),
      [formularioClave(function () { cargarInicio(); }, temporal),
        h('p', { class: 'login__ayuda' }, h('a', { href: '#', onclick: function (ev) { ev.preventDefault(); terminarSesion(); } }, 'Salir sin cambiarla'))]));
  }

  function terminarSesion(mensaje) {
    // Al salir se olvida todo lo de esa persona (importante en computadoras compartidas)
    E.token = null; E.ini = null; E.busqueda = null; E.inf = null; E.lista = []; cacheTurno = {}; dibujarInformes = null;
    E.tipo = null; E.anio = null; E.mostrar = 60; E.filtros = { q: '', estatus: '', acuse: '' };
    guardarLocal('cg_token', null);
    pila.slice().forEach(function (v) { v.cerrar(); });
    cerrarPanel();
    pantallaEntrar(mensaje);
  }

        desbloquear ? h('label', { class: 'casilla' }, desbloquear, 'Desbloquear (tiene intentos fallidos)') : null,
        nuevo ? h('div', { class: 'campo__ayuda' }, 'Se generará una contraseña temporal que tendrá que cambiar al entrar.') : h('div', { class: 'campo__ayuda' }, 'Si cambias rol, libretas o estado, tendrá que volver a entrar.')],
        pie: [h('button', { class: 'btn', onclick: function () { v.cerrar(); } }, 'Cancelar'),
          h('button', { class: 'btn btn--prim', onclick: function () {
            var tipos = rol.value === 'admin' ? '*' : cajas.filter(function (c) { return c.el.checked; }).map(function (c) { return c.t; });
            if (Array.isArray(tipos) && tipos.length === cajas.length) tipos = '*';
            llamar('guardarUsuario', { nuevo: nuevo, usuario: usuario.value, nombre: nombre.value, rol: rol.value, tipos: tipos,
              activo: activo.checked ? 'SI' : 'NO', desbloquear: desbloquear ? desbloquear.checked : false,
              informes: informes ? informes.checked : undefined }).then(function (r) {
              v.cerrar(); cargar(); cacheTurno = {};
              if (r.temporal) credenciales(r.usuario, r.temporal, 'Usuario creado'); else aviso('Usuario actualizado.', 'ok');
            }).catch(function (e) { vaciar(msg).appendChild(h('div', { class: 'alerta alerta--error' }, e.message)); });
          } }, nuevo ? 'Crear usuario' : 'Guardar')] });
    }
    cargar();
  };

  /* ───────────────────────── Bitácora ───────────────────────── */
  vistas.bitacora = function () {
    var f = { desde: h('input', { class: 'entrada', type: 'date', 'aria-label': 'Desde' }), hasta: h('input', { class: 'entrada', type: 'date', 'aria-label': 'Hasta' }),
      usuario: h('select', { class: 'entrada', 'aria-label': 'Usuario' }, h('option', { value: '' }, 'Todos los usuarios')),
      accion: h('select', { class: 'entrada', 'aria-label': 'Acción' }, h('option', { value: '' }, 'Todas las acciones')),
      texto: h('input', { class: 'entrada', type: 'search', placeholder: 'Buscar en el detalle…', 'aria-label': 'Buscar en el detalle' }) };
    var cont = h('div', { class: 'tarjeta' }, h('div', { class: 'vacio' }, 'Cargando…'));
    var conteo = h('p', { class: 'conteo' });
    var primera = true, espera = null;
    marco('bitacora').appendChild(h('div', null, h('div', { class: 'titulo-vista' }, h('h1', null, 'Bitácora'), h('span', { class: 'sub' }, 'Todo lo que se hace en el sistema queda aquí y no se puede borrar desde la app')),
      h('div', { class: 'herr' }, f.desde, f.hasta, f.usuario, f.accion, h('div', { class: 'buscador' }, icono('buscar'), f.texto)), conteo, cont));
    function cargar() {
      llamar('bitacora', { desde: f.desde.value, hasta: f.hasta.value, usuario: f.usuario.value, accion: f.accion.value, texto: f.texto.value }).then(function (r) {
        if (primera) {
          r.usuarios.forEach(function (u) { f.usuario.appendChild(h('option', { value: u }, u)); });
          r.acciones.forEach(function (a) { f.accion.appendChild(h('option', { value: a }, a)); });
          primera = false;
        }
        conteo.textContent = r.total > r.filas.length ? 'Mostrando los ' + r.filas.length + ' más recientes de ' + r.total : r.total + ' movimientos';
        vaciar(cont).appendChild(r.filas.length ? h('div', { class: 'tabla-env', style: { display: 'block' } }, h('table', { class: 'tabla bit' },
          h('thead', null, h('tr', null, ['Fecha', 'Usuario', 'Acción', 'Detalle'].map(function (x) { return h('th', null, x); }))),
          h('tbody', null, r.filas.map(function (x) {
            return h('tr', { style: { cursor: x.registro_id && /^(r|m-)/.test(x.registro_id) ? 'pointer' : 'default' }, onclick: function () { if (x.registro_id && /^(r|m-)/.test(x.registro_id)) abrirDetalle(x.registro_id); } },
              h('td', null, fechaCorta(x.fecha) + ' ' + String(x.fecha).slice(11, 16)), h('td', null, x.usuario), h('td', null, x.accion), h('td', null, x.detalle));
          })))) : h('div', { class: 'vacio' }, 'Sin movimientos con esos filtros.'));
      }).catch(fallo);
    }
    [f.desde, f.hasta, f.usuario, f.accion].forEach(function (x) { x.addEventListener('change', cargar); });
    f.texto.addEventListener('input', function () { clearTimeout(espera); espera = setTimeout(cargar, 400); });
    cargar();
  };

  /* ───────────────────────── Configuración ───────────────────────── */
  vistas.config = function () {
    var c = E.ini.config, enc = c.encabezados || [];
    var e1 = h('input', { class: 'entrada', value: enc[0] || '', maxlength: 200 });
    var e2 = h('input', { class: 'entrada', value: enc[1] || '', maxlength: 200 });
    var e3 = h('input', { class: 'entrada', value: enc[2] || '', maxlength: 200 });
    var pl = h('input', { class: 'entrada', value: c.plantilla_OFS || '', maxlength: 200 });
    var ej = h('div', { class: 'campo__ayuda' });
    var plazo = h('input', { class: 'entrada', type: 'number', min: 0, max: 365, value: c.plazo_dias || '', style: { maxWidth: '160px' } });
    var web = h('input', { class: 'entrada', type: 'url', value: c.url_web || '', maxlength: 200, placeholder: 'https://control-gestion.vercel.app' });
    function pintarEj() { ej.textContent = pl.value ? 'Ejemplo: ' + pl.value.replace('{NNN}', '417').replace('{AAAA}', E.ini.anioActual) : 'Sin plantilla: los oficios salientes solo tendrán consecutivo.'; }
    pl.addEventListener('input', pintarEj); pintarEj();
    marco('config').appendChild(h('div', null, h('div', { class: 'titulo-vista' }, h('h1', null, 'Configuración')),
      h('div', { class: 'tarjeta config' },
        campo('Encabezado · línea 1', e1), campo('Encabezado · línea 2', e2), campo('Encabezado · línea 3', e3, { ayuda: 'Salen en la pantalla de entrada y arriba de cada Excel.' }),
        h('div', null, campo('Número oficial de los oficios salientes', pl, { ayuda: '{NNN} es el consecutivo (001, 002…) y {AAAA} el año.' }), ej),
        campo('Plazo de respuesta por omisión (días hábiles)', plazo, { ayuda: 'Para entrantes: propone la fecha límite a partir de la fecha de recibido. Vacío o 0 = sin fecha límite automática.' }),
        campo('Dirección pública de la app', web, { ayuda: 'Si la publicaste en Vercel, ponla aquí: la dirección de Google (/exec) solo mostrará un enlace a ella. Vacío = se usa la de Google.' }),
        h('div', null, h('button', { class: 'btn btn--prim', onclick: function () {
          llamar('guardarConfig', { encabezado_1: e1.value, encabezado_2: e2.value, encabezado_3: e3.value, plantilla_OFS: pl.value, plazo_dias: plazo.value === '0' ? '' : plazo.value, url_web: web.value.trim() }).then(function (cfg) {
            E.ini.config = { encabezados: [cfg.encabezado_1, cfg.encabezado_2, cfg.encabezado_3].filter(Boolean), plantilla_OFS: cfg.plantilla_OFS, plazo_dias: cfg.plazo_dias, url_web: cfg.url_web || '' };
            aviso('Configuración guardada.', 'ok');
          }).catch(fallo);
        } }, 'Guardar'))),
      tiene('mantenimiento') ? tarjetaMantenimiento() : null,
      tiene('respaldo') ? h('div', { class: 'tarjeta config', style: { marginTop: '16px' } },
        h('h2', { class: 'config__t' }, icono('respaldo'), 'Respaldo completo'),
        h('p', { class: 'config__d' }, 'Un Excel con una hoja por pestaña de la base: Registros, Directorio, Usuarios (sin contraseñas), Bitácora y Configuración. Queda anotado en la Bitácora.'),
        h('p', { class: 'config__d' }, 'Guárdalo en un lugar seguro: trae datos personales. Los escaneos no van en el Excel; siguen en la carpeta «Archivos» del Drive de la cuenta dueña, y cada lunes se hace además una copia de la hoja en «Respaldos».'),
        h('div', null, h('button', { class: 'btn btn--prim', onclick: function () { descargarRespaldo(this); } }, icono('bajar'), 'Descargar respaldo completo'))) : null,
      h('div', { class: 'tarjeta config', style: { marginTop: '16px' } }, h('h2', { style: { fontSize: '16px' } }, 'Seguridad'),
        h('ul', { style: { margin: 0, paddingLeft: '18px', display: 'grid', gap: '6px', color: 'var(--texto-2)' } },
          h('li', null, 'La hoja de cálculo y las carpetas de Drive del sistema no deben compartirse con nadie: todos entran por esta app.'),
          h('li', null, 'Para revisarlo, el dueño de la hoja corre revisarSeguridad() desde Extensiones → Apps Script.'),
          h('li', null, 'Cada lunes se guarda una copia de la base en la carpeta «Respaldos» (se conservan las 8 más recientes).'),
          h('li', null, 'Cuando alguien deja el área: Usuarios → Editar → desmarca «Cuenta activa». Su historial se conserva.')))));
  };

  /** Modo mantenimiento: solo los administradores pueden usar el sistema mientras está prendido. */
  function tarjetaMantenimiento() {
    var m = E.ini.mantenimiento || { activo: false, mensaje: '' };
    var cont = h('div', { class: 'tarjeta config', style: { marginTop: '16px' } });
    function pintar() {
      var activo = !!m.activo;
      var texto = h('textarea', { class: 'entrada', rows: 2, maxlength: 300, placeholder: 'Ej.: Estamos actualizando el sistema. Regresa a las 3 de la tarde.',
        value: activo ? m.mensaje : '' });
      var cuenta = h('span', { class: 'campo__ayuda' });
      var contar = function () { cuenta.textContent = texto.value.length + ' de 300'; };
      texto.addEventListener('input', contar); contar();
      function guardar(prender) {
        var msg = texto.value.trim();
        if (prender && msg.length < 5) { aviso('Escribe el mensaje que verá la gente.', 'error'); texto.focus(); return; }
        var seguir = prender && !activo ? confirmar('Mientras esté prendido, las personas que no son administradoras verán este mensaje y saldrán del sistema (en unos minutos, o en cuanto hagan algo). No podrán entrar hasta que lo apagues.\n\n¿Prender el modo mantenimiento?', { si: 'Prender', titulo: 'Modo mantenimiento' }) : Promise.resolve(true);
        seguir.then(function (ok) {
          if (!ok) return;
          llamar('mantenimiento', { activo: prender, mensaje: msg }).then(function (r) {
            m = r; E.ini.mantenimiento = r;
            aviso(r.activo ? 'Modo mantenimiento prendido.' : 'Modo mantenimiento apagado: todos pueden entrar.', 'ok');
            pintar();
          }).catch(fallo);
        });
      }
      vaciar(cont).appendChild(h('div', { class: 'mant' },
        h('div', { class: 'mant__cab' }, h('h2', { class: 'config__t' }, icono('herramienta'), 'Modo mantenimiento'),
          h('span', { class: 'mant__estado' + (activo ? ' mant__estado--on' : '') }, activo ? 'Prendido' : 'Apagado')),
        h('p', { class: 'config__d' }, 'Úsalo cuando vayas a hacer cambios grandes. Mientras está prendido solo entran los administradores; los demás ven tu mensaje en la pantalla de entrada.'),
        campo('Mensaje para la gente', texto, { ayuda: null }), cuenta,
        h('div', { class: 'mant__botones' },
          activo ? h('button', { class: 'btn btn--prim', onclick: function () { guardar(false); } }, 'Apagar mantenimiento') :
            h('button', { class: 'btn btn--peligro-lleno', onclick: function () { guardar(true); } }, icono('herramienta'), 'Prender mantenimiento'),
          activo ? h('button', { class: 'btn', onclick: function () { guardar(true); } }, 'Cambiar el mensaje') : null)));
    }
    pintar();
    return cont;
  }

  /** Respaldo completo en Excel (se arma en el navegador con ExcelCG, sin librerías). */
  function descargarRespaldo(boton) {
    if (boton) { boton.disabled = true; }
    llamar('respaldo').then(function (r) {
      var NOMBRES = { Registros: 'Registros', Directorio: 'Directorio', Usuarios: 'Usuarios', Bitacora: 'Bitácora', Config: 'Configuración' };
      var FECHAS = { fecha: 1, fecha_recepcion: 1, fecha_limite: 1 };
      var NUMEROS = { anio: 1, consecutivo: 1, version: 1, intentos: 1 };
      var ANCHOS_R = { asunto: 50, observaciones: 44, dirigido_a: 34, firma: 34, detalle: 70, nombre: 30, cargo: 30, dependencia: 26, valor: 40, descripcion: 50, origen: 30, area: 28, motivo_cancelacion: 30 };
      var PIES = { Usuarios: 'Sin contraseñas ni sellos de sesión.', Registros: 'Sin los IDs internos de Drive: los escaneos están en la carpeta «Archivos» del Drive de la cuenta dueña.' };
      var cuando = fechaCorta(r.generado) + ' ' + String(r.generado).slice(11, 16);
      var hojas = Object.keys(r.hojas).map(function (k) {
        var x = r.hojas[k];
        return {
          nombre: NOMBRES[k] || k,
          titulos: (E.ini.config.encabezados || []).concat(['Control de Gestión · Respaldo completo · ' + (NOMBRES[k] || k),
            x.filas.length + ' filas · generado el ' + cuando + ' por ' + E.ini.yo.nombre + ' · versión ' + r.version]),
          encabezados: x.columnas,
          anchos: x.columnas.map(function (c) { return ANCHOS_R[c] || 16; }),
          tipos: x.columnas.map(function (c) { return FECHAS[c] ? 'fecha' : NUMEROS[c] ? 'numero' : 'texto'; }),
          filas: x.filas,
          pie: PIES[k] || 'Fuente: Control de Gestión.'
        };
      });
      descargarBytes(ExcelCG.libro(hojas), 'Respaldo Control de Gestión ' + String(r.generado).slice(0, 10) + '.xlsx',
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    }).catch(fallo).then(function () { if (boton) boton.disabled = false; });
  }

  /* ───────────────────────── Arranque ───────────────────────── */
  llamar('estado').then(function (p) {
    E.publico = p; E.publicoEn = Date.now();
    if (E.token) cargarInicio(); else pantallaEntrar();
  }).catch(function (e) {
    vaciar(app).appendChild(h('div', { class: 'arranque' }, h('div', { class: 'arranque__marca' }, 'Control de Gestión'),
      h('div', { class: 'alerta alerta--error', style: { maxWidth: '520px' } }, e.message)));
  });
})();
</script>

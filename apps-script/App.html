<script>
/* ════════════════════════════════════════════════════════════════════
   Control de Gestión · Aplicación (navegador)

   · Todo pasa por llamar(accion, datos) → google.script.run.api(token,…)
   · Nada de innerHTML con datos: la interfaz se arma con h(), que crea
     nodos y pone el texto como texto. Así un asunto con "<script>" se ve
     tal cual y no se ejecuta.
   · El token de sesión vive en sessionStorage (se borra al cerrar la
     pestaña) y la sesión expira sola en el servidor tras 3 h sin uso.
   ════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ───────────────────────── Utilidades ───────────────────────── */
  var ICONOS = {
    mas: '<path d="M12 5v14M5 12h14"/>',
    buscar: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    excel: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13l4 5M13 13l-4 5"/>',
    archivo: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    clip: '<path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>',
    cerrar: '<path d="M18 6 6 18M6 6l12 12"/>',
    editar: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m14 6 4 4"/>',
    responder: '<path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/>',
    cancelar: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    lista: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    libro: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
    usuarios: '<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
    historia: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
    engrane: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    salir: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
    llave: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2 2"/>',
    subir: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
    bajar: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
    ojo: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
    ojoNo: '<path d="M17.9 17.9A10.1 10.1 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/>',
    unir: '<path d="M8 3v6a4 4 0 0 0 4 4h0a4 4 0 0 1 4 4v4M16 3v6a4 4 0 0 1-4 4"/>',
    copiar: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    papelera: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>'
  };

  function icono(n) {
    var s = document.createElement('span');
    s.style.display = 'inline-flex';
    s.setAttribute('aria-hidden', 'true');
    // Solo trazos fijos de este archivo: nunca datos del usuario.
    s.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONOS[n] || '') + '</svg>';
    return s;
  }

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.keys(v).forEach(function (p) {
        if (p.slice(0, 2) === '--') el.style.setProperty(p, v[p]); else el.style[p] = v[p];
      });
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden' || k === 'readOnly') el[k] = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    });
    for (var i = 2; i < arguments.length; i++) agregar(el, arguments[i]);
    return el;
  }
  function agregar(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { agregar(el, x); }); return; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  function vaciar(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  }
  function pad3(n) { var s = String(n); return s.length >= 3 ? s : ('00' + s).slice(-3); }
  function etiquetaNum(r) { return pad3(r.consecutivo) + (r.sufijo ? ' ' + r.sufijo : '') + '/' + r.anio; }
  function fechaCorta(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function hoyIso() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function sumarHabiles(iso, n) {
    var p = iso.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]), k = 0;
    while (k < n) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) k++; }
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function diasHasta(iso) {
    var p = iso.split('-').map(Number), hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    return Math.round((new Date(p[0], p[1] - 1, p[2]) - hoy) / 86400000);
  }
  function lineas(s) { var p = String(s || '').split('\n'); return { primera: p[0], resto: p.slice(1).join(' ') }; }
  function guardarLocal(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
  function leerLocal(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  /* ───────────────────────── Estado ───────────────────────── */
  var E = {
    token: leerLocal('cg_token'), ini: null, publico: null, vista: 'registros', tipo: null, anio: null,
    lista: [], filtros: { q: '', estatus: '', acuse: '' }, mostrar: 60, directorio: []
  };
  var app = document.getElementById('app');

  function tipoDef(t) { return E.ini.todosTipos[t]; }
  function tieneCampo(t, c) { return tipoDef(t).campos.some(function (x) { return x[0] === c; }); }
  function etiquetaCampo(t, c, def) { var x = tipoDef(t).campos.filter(function (y) { return y[0] === c; })[0]; return x ? x[1] : def; }
  function puedeCapturar(t) { return E.ini && E.ini.yo.rol !== 'consulta' && (!t || E.ini.orden.indexOf(t) >= 0); }
  function esAdmin() { return E.ini && E.ini.yo.rol === 'admin'; }

  /* ───────────────────────── Servidor ───────────────────────── */
  var enVuelo = 0;
  function progreso(d) {
    enVuelo += d;
    var b = document.getElementById('progreso');
    if (enVuelo > 0) b.classList.add('activo'); else b.classList.remove('activo');
  }
  /**
   * Dos caminos al mismo servidor:
   *  · Dentro de Google (la URL /exec): google.script.run.api(…)
   *  · Publicada fuera (Vercel): fetch POST a la URL /exec configurada en
   *    config.js (window.CG_API). Se manda como text/plain para que el
   *    navegador no haga la consulta previa (Apps Script no la contesta).
   */
  function transporte(accion, datos) {
    var cuerpo = { token: E.token, accion: accion, datos: datos || {} };
    if (window.google && google.script && google.script.run) {
      return new Promise(function (ok, mal) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(mal).api(cuerpo.token, cuerpo.accion, cuerpo.datos);
      });
    }
    if (!window.CG_API) return Promise.reject(new Error('Falta configurar la dirección del servidor (CG_API_URL).'));
    return fetch(window.CG_API, { method: 'POST', redirect: 'follow', credentials: 'omit', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
  }

  function llamar(accion, datos) {
    progreso(1);
    return transporte(accion, datos).then(function (r) {
      progreso(-1);
      if (r && r.ok) return r.datos;
      var e = new Error(r && r.error ? r.error : 'Respuesta inesperada del servidor.');
      e.codigo = r && r.codigo; e.extra = r && r.extra;
      if (e.codigo === 'SESION') { terminarSesion(e.message); }
      else if (e.codigo === 'CAMBIAR_CLAVE') { pantallaCambiarClave(true); }
      throw e;
    }, function () {
      progreso(-1);
      var e = new Error('No hubo conexión con el servidor. Revisa tu internet e intenta de nuevo.');
      e.codigo = 'RED';
      throw e;
    });
  }
  function fallo(e) { if (e && e.codigo !== 'SESION' && e.codigo !== 'CAMBIAR_CLAVE') aviso(e.message || String(e), 'error'); }

  /* ───────────────────────── Avisos y ventanas ───────────────────────── */
  function aviso(texto, tipo, extra) {
    var cont = document.getElementById('avisos');
    var el = h('div', { class: 'aviso aviso--' + (tipo || 'info') }, h('div', null, texto, extra ? h('div', { style: { marginTop: '6px' } }, extra) : null),
      h('button', { 'aria-label': 'Cerrar aviso', onclick: function () { el.remove(); } }, '✕'));
    cont.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, tipo === 'error' ? 9000 : extra ? 12000 : 4500);
  }

  var pila = [];
  function ventana(o) {
    var velo = h('div', { class: 'velo velo--modal' });
    var cuerpo = h('div', { class: 'modal__cuerpo' }, o.cuerpo);
    var pie = h('div', { class: 'modal__pie' }, o.pie || null);
    var caja = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': o.titulo, style: { '--ancho': (o.ancho || 720) + 'px' } },
      h('div', { class: 'modal__cab' }, h('h2', null, o.titulo), h('button', { class: 'icono-btn', 'aria-label': 'Cerrar', onclick: function () { intentarCerrar(); } }, icono('cerrar'))),
      cuerpo, o.pie ? pie : null);
    var v = { caja: caja, cuerpo: cuerpo, pie: pie, cerrar: cerrar, alCerrar: o.alCerrar, antesDeCerrar: o.antesDeCerrar };
    function cerrar() {
      velo.remove(); caja.remove();
      pila = pila.filter(function (x) { return x !== v; });
      document.removeEventListener('keydown', tecla);
      if (v.alCerrar) v.alCerrar();
    }
    function intentarCerrar() {
      if (v.antesDeCerrar) Promise.resolve(v.antesDeCerrar()).then(function (s) { if (s !== false) cerrar(); });
      else cerrar();
    }
    v.intentarCerrar = intentarCerrar;
    function tecla(ev) { if (ev.key === 'Escape' && pila[pila.length - 1] === v) intentarCerrar(); }
    velo.addEventListener('click', intentarCerrar);
    document.addEventListener('keydown', tecla);
    document.body.appendChild(velo);
    document.body.appendChild(caja);
    pila.push(v);
    var primero = caja.querySelector('input:not([type=hidden]):not([type=file]):not([readonly]), textarea, select');
    if (primero && !o.sinFoco) primero.focus();
    return v;
  }

  function confirmar(texto, o) {
    o = o || {};
    return new Promise(function (res) {
      var listo = false;
      var v = ventana({ titulo: o.titulo || 'Confirmar', ancho: 460, sinFoco: true, cuerpo: h('div', { style: { whiteSpace: 'pre-wrap' } }, texto),
        alCerrar: function () { if (!listo) res(false); },
        pie: [h('button', { class: 'btn', onclick: function () { v.cerrar(); } }, o.no || 'Cancelar'),
          h('button', { class: 'btn ' + (o.peligro ? 'btn--peligro-lleno' : 'btn--prim'), onclick: function () { listo = true; v.cerrar(); res(true); } }, o.si || 'Aceptar')] });
    });
  }

  function campo(etiqueta, control, o) {
    o = o || {};
    var objetivo = /^(INPUT|SELECT|TEXTAREA)$/.test(control.tagName) ? control : control.querySelector && control.querySelector('input, select, textarea');
    var id = null;
    if (objetivo) { if (!objetivo.id) objetivo.id = 'c' + Math.random().toString(36).slice(2, 9); id = objetivo.id; }
    return h('div', { class: 'campo' + (o.ancho ? ' ancho' : '') },
      h('label', { for: id }, etiqueta, o.req ? h('span', { style: { color: 'var(--guinda)' } }, ' *') : null),
      control, o.ayuda ? h('div', { class: 'campo__ayuda' }, o.ayuda) : null);
  }

  function insEstatus(est) {
    return h('span', { class: 'ins ins--' + String(est || 'sin').replace(/\s+/g, '-') }, est || 'Sin estatus');
  }
  function insVence(r) {
    if (!r.fecha_limite || ['Atendido', 'Concluido', 'Cancelado'].indexOf(r.estatus) >= 0) return null;
    var d = diasHasta(r.fecha_limite);
    if (d < 0) return h('span', { class: 'ins ins--vencido' }, 'Vencido hace ' + (-d) + ' d');
    if (d === 0) return h('span', { class: 'ins ins--hoy' }, 'Vence hoy');
    if (d <= 3) return h('span', { class: 'ins ins--pronto' }, 'Vence en ' + d + ' d');
    return h('span', { class: 'ins' }, 'Límite ' + fechaCorta(r.fecha_limite));
  }

  function descargarBytes(bytes, nombre, mime) {
    // Sin acentos ni símbolos: algunos navegadores ignoran el nombre si los trae
    nombre = String(nombre || 'archivo').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w .()-]+/g, '_');
    var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    var a = h('a', { href: url, download: nombre, style: { display: 'none' } });
    document.body.appendChild(a);
    try { a.click(); } catch (e) { /* algunos navegadores lo bloquean */ }
    a.remove();
    aviso('Listo: ' + nombre, 'ok', h('a', { href: url, download: nombre, style: { color: '#fff', fontWeight: 500 } }, 'Si no se descargó, haz clic aquí'));
    setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
  }

  function b64aBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* ───────────────────────── Entrar ───────────────────────── */
  function encabezadoInst() {
    var enc = (E.ini && E.ini.config.encabezados) || (E.publico && E.publico.encabezados) || [];
    return enc;
  }

  function pantallaEntrar(mensaje) {
    document.title = 'Control de Gestión';
    var usuario = h('input', { class: 'entrada', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', required: true, maxlength: 30 });
    var clave = h('input', { class: 'entrada', type: 'password', autocomplete: 'current-password', required: true, maxlength: 128 });
    var ver = h('button', { type: 'button', class: 'icono-btn', 'aria-label': 'Mostrar contraseña', onclick: function () {
      clave.type = clave.type === 'password' ? 'text' : 'password'; vaciar(ver).appendChild(icono(clave.type === 'password' ? 'ojo' : 'ojoNo'));
    } }, icono('ojo'));
    var msg = h('div', null, mensaje ? h('div', { class: 'alerta alerta--info' }, mensaje) : null);
    var boton = h('button', { class: 'btn btn--prim', type: 'submit', style: { width: '100%', minHeight: '42px' } }, 'Entrar');
    var form = h('form', { class: 'login__cuerpo', onsubmit: function (ev) {
      ev.preventDefault();
      boton.disabled = true; boton.textContent = 'Entrando…';
      llamar('entrar', { usuario: usuario.value, clave: clave.value }).then(function (r) {
        E.token = r.token; guardarLocal('cg_token', r.token);
        E.usuarioEntrada = usuario.value.trim().toLowerCase();
        if (r.debe_cambiar) pantallaCambiarClave(true, clave.value);
        else cargarInicio();
      }).catch(function (e) {
        vaciar(msg).appendChild(h('div', { class: 'alerta alerta--error' }, e.message));
        boton.disabled = false; boton.textContent = 'Entrar';
        clave.value = ''; clave.focus();
      });
    } }, msg, campo('Usuario', usuario), campo('Contraseña', h('div', { class: 'clave-envoltura' }, clave, ver)), boton);
    vaciar(app).appendChild(h('div', { class: 'login' },
      h('div', { class: 'login__caja' },
        h('div', { class: 'login__cab' }, h('div', { class: 'login__dep' }, encabezadoInst().map(function (l) { return h('div', null, l); })),
          h('div', { class: 'login__titulo' }, 'Control de Gestión')),
        form,
        h('div', { class: 'login__pie' }, 'Si olvidaste tu contraseña, pide a un administrador que la restablezca.'))));
    setTimeout(function () { usuario.focus(); }, 50);
  }

  function reglasClave(valor, usuario) {
    return [
      [valor.length >= 8, 'Al menos 8 caracteres'],
      [/[A-Za-zÁÉÍÓÚáéíóúÑñ]/.test(valor) && /\d/.test(valor), 'Letras y números'],
      [!usuario || valor.toLowerCase().indexOf(usuario.toLowerCase()) < 0, 'Que no contenga tu usuario']
    ];
  }

  function formularioClave(alTerminar, actualConocida) {
    var usuario = (E.ini && E.ini.yo.usuario) || E.usuarioEntrada || '';
    var actual = h('input', { class: 'entrada', type: 'password', autocomplete: 'current-password', value: actualConocida || '' });
    var nueva = h('input', { class: 'entrada', type: 'password', autocomplete: 'new-password', maxlength: 128 });
    var repite = h('input', { class: 'entrada', type: 'password', autocomplete: 'new-password', maxlength: 128 });
    var lista = h('ul', { class: 'reglas' });
    var msg = h('div');
    function pintar() {
      vaciar(lista);
      reglasClave(nueva.value, usuario).concat([[nueva.value && nueva.value === repite.value, 'Las dos coinciden']]).forEach(function (r) {
        lista.appendChild(h('li', { class: r[0] ? 'ok' : '' }, r[1]));
      });
    }
    nueva.addEventListener('input', pintar); repite.addEventListener('input', pintar); pintar();
    var boton = h('button', { class: 'btn btn--prim', type: 'submit' }, 'Guardar contraseña');
    var form = h('form', { style: { display: 'grid', gap: '12px' }, onsubmit: function (ev) {
      ev.preventDefault();
      if (nueva.value !== repite.value) { vaciar(msg).appendChild(h('div', { class: 'alerta alerta--error' }, 'Las contraseñas no coinciden.')); return; }
      boton.disabled = true;
      llamar('cambiarClave', { actual: actual.value, nueva: nueva.value }).then(function (r) {
        E.token = r.token; guardarLocal('cg_token', r.token);
        aviso('Contraseña actualizada.', 'ok');
        alTerminar();
      }).catch(function (e) { boton.disabled = false; vaciar(msg).appendChild(h('div', { class: 'alerta alerta--error' }, e.message)); });
    } }, msg,
      actualConocida ? null : campo('Contraseña actual', actual),
      campo('Contraseña nueva', nueva), campo('Repítela', repite), lista, boton);
    return form;
  }

  function pantallaCambiarClave(forzada, temporal) {
    if (!forzada) {
      var v = ventana({ titulo: 'Cambiar mi contraseña', ancho: 440, cuerpo: formularioClave(function () { v.cerrar(); }) });
      return;
    }
